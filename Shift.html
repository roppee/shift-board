// ── ユーティリティ ─────────────────────────────────────────
const getDaysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
const getDow        = (y, m, d) => new Date(y, m, d).getDay();
const fmt2          = n => String(n).padStart(2, "0");
const dateKey       = (y, m, d) => `${y}-${fmt2(m + 1)}-${fmt2(d)}`;

function getWeekDates(base) {
  const d      = new Date(base);
  const offset = (d.getDay() + 6) % 7;
  const mon    = new Date(d);
  mon.setDate(d.getDate() - offset);
  return Array.from({ length: 7 }, (_, i) => {
    const dd = new Date(mon);
    dd.setDate(mon.getDate() + i);
    return dd;
  });
}

// ── 自動生成エンジン ───────────────────────────────────────
function autoGenerate(employees, year, month, wishdays, constraints, required, shiftHours, customShifts, orderConstraints, lockedInitial, prevMonthTail, fixedRules) {
  const days = getDaysInMonth(year, month);
  const OC = orderConstraints || ORDER_CONSTRAINTS_DEFAULT;
  const result = {};
  employees.forEach(e => { result[e.id] = {}; });

  if (lockedInitial) {
    employees.forEach(emp => {
      Object.entries(lockedInitial[emp.id] || {}).forEach(([d, v]) => {
        result[emp.id][Number(d)] = v;
      });
    });
  }

  if (fixedRules && fixedRules.length > 0) {
    for (let d=1; d<=days; d++) {
      const dow = getDow(year, month, d);
      fixedRules.forEach(rule => {
        if (rule.dow !== dow) return;
        if (result[rule.empId]?.[d]) return;
        if (!result[rule.empId]) return;
        result[rule.empId][d] = rule.shiftKey;
      });
    }
  }

  employees.forEach(emp => {
    const ws = wishdays[emp.id] || new Set();
    for (let d=1; d<=days; d++) {
      if (!result[emp.id][d] && ws.has(dateKey(year,month,d))) result[emp.id][d]="希望休";
    }
  });

  const getC = emp => constraints[emp.id] || DEFAULT_CONSTRAINTS;

  const remainAvailDays = (id, fromDay) => {
    let cnt = 0;
    for (let d=fromDay; d<=days; d++) { if (!result[id][d]) cnt++; }
    return cnt;
  };

  const remainNeeded = (id) => {
    const c = getC(employees.find(e=>e.id===id));
    const worked = Object.values(result[id]).filter(v=>!["休み","希望休"].includes(v)).length;
    return Math.max(0, c.minWorkDays - worked);
  };

  for (let d=1; d<=days; d++) {
    const dow = getDow(year,month,d);
    const avail = employees.filter(emp => !result[emp.id][d] && !getC(emp).unavailableDows.includes(dow));

    const workCount  = id => Object.values(result[id]).filter(v=>!["休み","希望休"].includes(v)).length;
    const hoursCount = id => Object.values(result[id]).reduce((a,v)=>a+(shiftHours[v]||0),0);
    const consec = id => {
      let c=0;
      if (d===1 && prevMonthTail) {
        for (let dd=prevMonthTail.totalDays; dd>=1; dd--) {
          const s=prevMonthTail.shifts?.[id]?.[dd]||"休み";
          if(!["休み","希望休"].includes(s)) c++; else break;
        }
        return c;
      }
      for(let dd=d-1;dd>=1;dd--){ if(!["休み","希望休"].includes(result[id][dd]||""))c++; else break; }
      return c;
    };
    const checkOrder = (id,type) => {
      const prev = d===1
        ? (prevMonthTail?.shifts?.[id]?.[prevMonthTail.totalDays] || null)
        : result[id][d-1];
      if(!prev) return true;
      return !(OC[prev]||[]).includes(type);
    };

    for (const s of customShifts) {
      const needed=required[s.key]||0; if(!needed) continue;
      let assigned=0;

      const shuffled=[...avail].sort(()=>Math.random()-0.5);
      shuffled.sort((a,b)=>{
        const ra=remainAvailDays(a.id, d)||1;
        const rb=remainAvailDays(b.id, d)||1;
        const na=remainNeeded(a.id);
        const nb=remainNeeded(b.id);
        return (nb/rb)-(na/ra);
      });

      for (const emp of shuffled) {
        if (assigned>=needed||result[emp.id][d]) continue;
        const c=getC(emp);
        if (!c.preferredShifts.includes(s.key)) continue;
        if (consec(emp.id)>=c.maxConsecutive) continue;
        if (workCount(emp.id)>=c.maxWorkDays) continue;
        if (hoursCount(emp.id)+(s.endH-s.startH)>c.maxWorkHours) continue;
        if (!checkOrder(emp.id,s.key)) continue;
        result[emp.id][d]=s.key; assigned++;
      }

      if (assigned < needed) {
        for (const emp of shuffled) {
          if (assigned>=needed||result[emp.id][d]) continue;
          const c=getC(emp);
          if (!c.preferredShifts.includes(s.key)) continue;
          if (!checkOrder(emp.id,s.key)) continue;
          if (consec(emp.id)>=c.maxConsecutive+1) continue;
          result[emp.id][d]=s.key; assigned++;
        }
      }

      if (assigned < needed) {
        for (const emp of shuffled) {
          if (assigned>=needed||result[emp.id][d]) continue;
          const c=getC(emp);
          if (!c.preferredShifts.includes(s.key)) continue;
          result[emp.id][d]=s.key; assigned++;
        }
      }
    }

    employees.forEach(emp=>{ if(!result[emp.id][d]) result[emp.id][d]="休み"; });
  }
  return result;
}

// ── 候補評価（アラート数計算） ────────────────────────────
function computeAlertsForShifts(shifts, staffList, customShifts, required, constraints, SHIFT_HOURS, orderConstraints, year, month, daysInMonth) {
  const isWork = v => !["休み","希望休"].includes(v);

  let staffingCount = 0;
  for (let d=1; d<=daysInMonth; d++) {
    customShifts.forEach(s => {
      const needed = required[s.key] || 0;
      if (!needed) return;
      const actual = staffList.filter(emp => shifts[emp.id]?.[d] === s.key).length;
      if (actual < needed) staffingCount++;
    });
  }

  let constraintCount = 0;
  staffList.forEach(emp => {
    const es = shifts[emp.id] || {};
    const c  = constraints[emp.id] || DEFAULT_CONSTRAINTS;
    const workDays  = Object.values(es).filter(isWork).length;
    const workHours = Object.values(es).reduce((a, v) => a + (SHIFT_HOURS[v] || 0), 0);
    const reasons = [];
    if (workDays  < c.minWorkDays)  reasons.push(1);
    if (workDays  > c.maxWorkDays)  reasons.push(1);
    if (workHours < c.minWorkHours) reasons.push(1);
    if (workHours > c.maxWorkHours) reasons.push(1);
    let maxConsec = 0, cur = 0;
    for (let d=1; d<=daysInMonth; d++) {
      if (isWork(es[d]||"休み")) { cur++; maxConsec=Math.max(maxConsec,cur); } else { cur=0; }
    }
    if (maxConsec > c.maxConsecutive) reasons.push(1);
    for (let d=2; d<=daysInMonth; d++) {
      const p=es[d-1], q=es[d];
      if (p && q && (orderConstraints[p]||[]).includes(q)) reasons.push(1);
    }
    if (reasons.length > 0) constraintCount++;
  });

  return { staffingCount, constraintCount, total: staffingCount + constraintCount };
}

// ── コンテキスト ──────────────────────────────────────────
const ShiftContext = createContext(null);
const useShift = () => useContext(ShiftContext);

// ── 共通コンポーネント ─────────────────────────────────────
function Pill({ type, small, pad, fsize, mw }) {
  const { SHIFT_TYPES } = useShift();
  const t    = SHIFT_TYPES[type] || FIXED_TYPES["休み"];
  const p    = pad   ?? (small ? "2px 5px" : "3px 9px");
  const fs   = fsize ?? (small ? 9 : 11);
  const minW = mw    ?? (small ? 20 : 28);
  return (
    <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",padding:p,borderRadius:6,fontSize:fs,fontWeight:700,background:t.bg,color:t.text,border:`1px solid ${t.color}55`,minWidth:minW,whiteSpace:"nowrap"}}>
      {small ? t.short : t.label}
    </span>
  );
}

function CellPicker({ empId, dayKey, onClose }) {
  const { SHIFT_TYPES, setCellShift } = useShift();
  return (
    <div style={{position:"absolute",zIndex:200,background:C.surface,border:`1px solid ${C.border2}`,borderRadius:12,boxShadow:"0 8px 32px rgba(0,0,0,0.12)",padding:"10px 12px",display:"flex",flexDirection:"column",gap:5,minWidth:130}}>
      {Object.entries(SHIFT_TYPES).map(([t,v]) => (
        <button key={t} onClick={() => setCellShift(empId, dayKey, t)} style={{background:v.bg,color:v.text,border:`1px solid ${v.color}55`,borderRadius:7,padding:"6px 10px",cursor:"pointer",fontWeight:700,fontSize:12,textAlign:"left",fontFamily:"inherit"}}>
          {t} <span style={{fontSize:9,opacity:0.55,marginLeft:4}}>{v.hours}</span>
        </button>
      ))}
      <button onClick={onClose} style={{marginTop:2,fontSize:11,color:C.textMute,background:"none",border:"none",cursor:"pointer",fontFamily:"inherit"}}>キャンセル</button>
    </div>
  );
}

function TimePicker({ value, onChange, min, max, label }) {
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
      <div style={{fontSize:10,color:C.textSub,fontWeight:600}}>{label}</div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",background:C.surface2,borderRadius:10,border:`1.5px solid ${C.border2}`,overflow:"hidden",width:56}}>
        <button onClick={() => onChange(Math.min(max, value+1))} style={{width:"100%",padding:"8px 0",border:"none",background:"none",cursor:"pointer",fontSize:16,color:C.textSub,fontFamily:"inherit"}}>▲</button>
        <div style={{width:"100%",padding:"6px 0",textAlign:"center",fontSize:20,fontWeight:700,color:C.accent,borderTop:`1px solid ${C.border}`,borderBottom:`1px solid ${C.border}`}}>
          {String(value).padStart(2,"0")}
        </div>
        <button onClick={() => onChange(Math.max(min, value-1))} style={{width:"100%",padding:"8px 0",border:"none",background:"none",cursor:"pointer",fontSize:16,color:C.textSub,fontFamily:"inherit"}}>▼</button>
      </div>
    </div>
  );
}

function CountPicker({ value, onChange }) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <button onClick={() => onChange(Math.max(0, value-1))} style={{width:32,height:32,borderRadius:8,border:`1px solid ${C.border}`,background:C.surface2,cursor:"pointer",fontSize:18,color:C.textSub,fontFamily:"inherit",fontWeight:700}}>−</button>
      <span style={{minWidth:32,textAlign:"center",fontSize:18,fontWeight:700,color:C.accent}}>{value}</span>
      <button onClick={() => onChange(value+1)} style={{width:32,height:32,borderRadius:8,border:`1px solid ${C.border}`,background:C.surface2,cursor:"pointer",fontSize:18,color:C.textSub,fontFamily:"inherit",fontWeight:700}}>＋</button>
    </div>
  );
}

// ── 月表示 ────────────────────────────────────────────────
function MonthView() {
  const { staffList, staffShifts, stats, lockedCells, editCell, setEditCell,
          year, month, daysInMonth, today, toggleAllLock, toggleCellLock,
          prevMonthTail, SHIFT_TYPES, density } = useShift();
  const DS = density==="compact"
    ? { nameColW:120, namePad:"3px 8px",  dataPad:"1px 0",  bp:"1px 4px",  bfs:9,  bmw:16 }
    : density==="wide"
    ? { nameColW:160, namePad:"7px 14px", dataPad:"4px 1px",bp:"4px 12px", bfs:12, bmw:28 }
    : { nameColW:150, namePad:"5px 12px", dataPad:"2px 1px",bp:"2px 5px",  bfs:9,  bmw:20 };
  const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);
  const prevTailDays = prevMonthTail
    ? Array.from({length:prevMonthTail.tailCount},(_,i)=>prevMonthTail.totalDays-(prevMonthTail.tailCount-1)+i).filter(d=>d>=1)
    : [];

  return (
    <div style={{overflowX:"auto"}}>
      <table style={{borderCollapse:"collapse",width:"100%",minWidth:900,fontSize:11}}>
        <thead>
          <tr>
            <th style={{...S.th(DS.nameColW),textAlign:"left",paddingLeft:12}}>氏名</th>
            {prevTailDays.map(d => {
              const prevMonth2 = month===0?11:month-1;
              const dow = getDow(month===0?year-1:year, prevMonth2, d);
              return (
                <th key={`prev-${d}`} className="no-print" style={{...S.th(28),color:C.border2,background:"var(--badge-off-bg)",opacity:0.7}}>
                  <div style={{fontSize:8,color:C.textMute}}>{d}</div>
                  <div style={{fontSize:7,color:C.border2}}>{DOW[dow]}</div>
                </th>
              );
            })}
            {prevTailDays.length > 0 && <th className="no-print" style={{width:4,background:C.border,padding:0}}/>}
            {days.map(d => {
              const dow = getDow(year, month, d);
              const isToday = d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
              return (
                <th key={d} style={{...S.th(32),color:dow===0?"var(--color-sunday)":dow===6?"var(--color-saturday)":C.textMute,background:isToday?C.accentBg:dow===0?C.redBg:dow===6?"#f0f8ff":C.surface}}>
                  <div style={{fontWeight:700}}>{d}</div>
                  <div style={{fontSize:8}}>{DOW[dow]}</div>
                  {isToday && <div style={{width:4,height:4,borderRadius:"50%",background:C.accent,margin:"1px auto 0"}}/>}
                </th>
              );
            })}
            <th style={S.th(52)}>勤務</th><th style={S.th(56)}>時間</th><th style={S.th(36)}>状態</th>
          </tr>
        </thead>
        <tbody>
          {staffList.map((emp, ei) => {
            const st = stats.find(s => s.id === emp.id);
            const locked = lockedCells[emp.id] || new Set();
            const allDays = Array.from({ length: daysInMonth }, (_, i) => i + 1);
            const allLocked = allDays.every(d => locked.has(d));
            const anyLocked = allDays.some(d => locked.has(d));
            return (
              <tr key={emp.id} style={{background:ei%2===0?C.surface:C.surface2}}>
                <td style={{padding:DS.namePad,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{width:8,height:8,borderRadius:"50%",background:emp.color,flexShrink:0}}/>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:600,fontSize:12}}>{emp.name}</div>
                      <div style={{fontSize:9,color:C.textMute}}>{emp.role}</div>
                    </div>
                    <button
                      onClick={() => toggleAllLock(emp.id)}
                      title={allLocked?"全解除":"全ロック"}
                      style={{background:allLocked?"var(--badge-hayaA-bg)":anyLocked?C.amberBg:C.surface2,border:`1px solid ${allLocked?C.amber:anyLocked?"#fbbf24":C.border}`,borderRadius:6,cursor:"pointer",fontSize:10,padding:"2px 5px",color:allLocked?"var(--badge-hayaA-text)":anyLocked?"#b45309":C.textMute,fontWeight:700,lineHeight:1,flexShrink:0}}>
                      {allLocked?"🔒全":"🔓全"}
                    </button>
                  </div>
                </td>
                {prevTailDays.map(d => {
                  const t = prevMonthTail?.shifts?.[emp.id]?.[d] || "休み";
                  const st2 = SHIFT_TYPES[t] || FIXED_TYPES["休み"];
                  return (
                    <td key={`prev-${d}`} className="no-print" style={{padding:"2px 1px",borderBottom:`1px solid ${C.border}`,textAlign:"center",background:"var(--badge-off-bg)",opacity:0.55}}>
                      <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",padding:"2px 4px",borderRadius:5,fontSize:9,fontWeight:700,background:C.surface2,color:C.textMute,border:`1px solid ${C.border}`,minWidth:18,whiteSpace:"nowrap"}}>{st2.short}</span>
                    </td>
                  );
                })}
                {prevTailDays.length > 0 && <td className="no-print" style={{width:4,background:C.border,padding:0,borderBottom:`1px solid ${C.border}`}}/>}
                {days.map(d => {
                  const type = staffShifts[emp.id]?.[d] || "休み";
                  const cid = `${emp.id}-${d}`, isOpen = editCell === cid;
                  const isLocked = locked.has(d);
                  let pressTimer = null;
                  const onPressStart = () => { pressTimer = setTimeout(() => { toggleCellLock(emp.id, d); pressTimer = null; }, 500); };
                  const onPressEnd   = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
                  return (
                    <td key={d} style={{padding:DS.dataPad,borderBottom:`1px solid ${C.border}`,textAlign:"center",position:"relative",background:isLocked?C.amberBg:""}}>
                      <button
                        onClick={() => setEditCell(isOpen ? null : cid)}
                        onMouseDown={onPressStart} onMouseUp={onPressEnd} onMouseLeave={onPressEnd}
                        onTouchStart={onPressStart} onTouchEnd={onPressEnd}
                        onContextMenu={e => e.preventDefault()}
                        style={{background:"none",border:"none",cursor:"pointer",padding:1,position:"relative",WebkitUserSelect:"none",userSelect:"none",whiteSpace:"nowrap",lineHeight:1}}>
                        <Pill type={type} small pad={DS.bp} fsize={DS.bfs} mw={DS.bmw}/>
                        {isLocked && <span style={{position:"absolute",top:-3,right:-3,fontSize:7,lineHeight:1}}>🔒</span>}
                      </button>
                      {isOpen && (
                        <div style={{position:"absolute",top:"100%",left:"50%",transform:"translateX(-50%)",zIndex:200}}>
                          <CellPicker empId={emp.id} dayKey={d} onClose={() => setEditCell(null)}/>
                        </div>
                      )}
                    </td>
                  );
                })}
                <td style={{textAlign:"center",fontWeight:700,color:st?.daysOk?C.green:C.amber,borderBottom:`1px solid ${C.border}`,fontSize:11}}>{st?.workDays??0}日</td>
                <td style={{textAlign:"center",fontWeight:700,color:st?.hoursOk?C.green:C.amber,borderBottom:`1px solid ${C.border}`,fontSize:11}}>{st?.workHours??0}h</td>
                <td style={{textAlign:"center",borderBottom:`1px solid ${C.border}`}}>{(st?.daysOk&&st?.hoursOk)?<span style={{color:C.green}}>✓</span>:<span style={{color:C.amber}}>⚠</span>}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── 週表示 ────────────────────────────────────────────────
function WeekView() {
  const { staffList, staffShifts, editCell, setEditCell,
          year, month, today, weekDates, SHIFT_TYPES } = useShift();
  return (
    <div style={{overflowX:"auto"}}>
      <table style={{borderCollapse:"collapse",width:"100%",fontSize:12}}>
        <thead>
          <tr>
            <th style={{...S.th(150),textAlign:"left",paddingLeft:12}}>氏名</th>
            {weekDates.map((d, i) => {
              const dow = d.getDay(), isToday = d.toDateString()===today.toDateString();
              return (
                <th key={i} style={{...S.th(120),color:dow===0?"var(--color-sunday)":dow===6?"var(--color-saturday)":C.textSub,background:isToday?C.accentBg:C.surface}}>
                  <div style={{fontWeight:700}}>{DOW[dow]}</div>
                  <div style={{fontSize:10}}>{d.getMonth()+1}/{d.getDate()}</div>
                  {isToday && <div style={{fontSize:9,color:C.accent,fontWeight:700}}>TODAY</div>}
                </th>
              );
            })}
          </tr>
        </thead>
        <tbody>
          {staffList.map((emp, ei) => (
            <tr key={emp.id} style={{background:ei%2===0?C.surface:C.surface2}}>
              <td style={{padding:"8px 12px",borderBottom:`1px solid ${C.border}`}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{width:8,height:8,borderRadius:"50%",background:emp.color}}/>
                  <div>
                    <div style={{fontWeight:600}}>{emp.name}</div>
                    <div style={{fontSize:10,color:C.textMute}}>{emp.role}</div>
                  </div>
                </div>
              </td>
              {weekDates.map((d, i) => {
                const inMonth = d.getMonth()===month && d.getFullYear()===year;
                const type = inMonth ? (staffShifts[emp.id]?.[d.getDate()] || "休み") : "休み";
                const cid = `w-${emp.id}-${d.toDateString()}`, isOpen = editCell === cid;
                return (
                  <td key={i} style={{padding:"8px 6px",borderBottom:`1px solid ${C.border}`,textAlign:"center",position:"relative"}}>
                    <button onClick={() => inMonth && setEditCell(isOpen ? null : cid)} style={{background:"none",border:"none",cursor:inMonth?"pointer":"default",padding:0}}>
                      <Pill type={type}/>
                      {inMonth && !["休み","希望休"].includes(type) && <div style={{fontSize:9,color:C.textMute,marginTop:2}}>{SHIFT_TYPES[type]?.hours}</div>}
                    </button>
                    {isOpen && inMonth && (
                      <div style={{position:"absolute",top:"100%",left:"50%",transform:"translateX(-50%)"}}>
                        <CellPicker empId={emp.id} dayKey={d.getDate()} onClose={() => setEditCell(null)}/>
                      </div>
                    )}
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ── 希望休タブ ────────────────────────────────────────────
function WishTab() {
  const { staffList, wishdays, toggleWish, density, setDensity } = useShift();
  const DS = density==="compact"
    ? { nameColW:120, namePad:"3px 8px",  dataPad:"1px 0",  btnSize:18 }
    : density==="wide"
    ? { nameColW:160, namePad:"7px 14px", dataPad:"4px 1px",btnSize:28 }
    : { nameColW:150, namePad:"5px 12px", dataPad:"2px 1px",btnSize:22 };
  const today = new Date();
  const [wishDate, setWishDate] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const wy = wishDate.getFullYear(), wm = wishDate.getMonth(), wDays = getDaysInMonth(wy, wm);
  const days = Array.from({ length: wDays }, (_, i) => i + 1);
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:6,background:C.surface2,borderRadius:9,padding:"4px 8px",border:`1px solid ${C.border}`,height:36}}>
          <button onClick={() => setWishDate(new Date(wy,wm-1,1))} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:C.textSub,padding:"0 4px"}}>‹</button>
          <span style={{fontWeight:800,fontSize:14,minWidth:170,textAlign:"center"}}>{wy}年 {wm+1}月</span>
          <button onClick={() => setWishDate(new Date(wy,wm+1,1))} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:C.textSub,padding:"0 4px"}}>›</button>
        </div>
        <div style={{display:"flex",gap:3,background:C.surface2,borderRadius:9,padding:3,border:`1px solid ${C.border}`}}>
          {[["compact","密"],["standard","標準"],["wide","広"]].map(([val,lbl]) => (
            <button key={val} onClick={() => setDensity(val)}
              style={{padding:"6px 12px",borderRadius:7,border:"none",background:density===val?C.accent:"transparent",color:density===val?"#fff":C.textSub,fontWeight:700,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>
              {lbl}
            </button>
          ))}
        </div>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:800,fontSize:11}}>
          <thead>
            <tr>
              <th style={{...S.th(DS.nameColW),textAlign:"left",paddingLeft:12}}>氏名</th>
              {days.map(d => {
                const dow = getDow(wy, wm, d);
                return <th key={d} style={{...S.th(30),color:dow===0?"var(--color-sunday)":dow===6?"var(--color-saturday)":C.textMute}}><div>{d}</div><div style={{fontSize:8}}>{DOW[dow]}</div></th>;
              })}
              <th style={S.th(48)}>件数</th>
            </tr>
          </thead>
          <tbody>
            {staffList.map((emp, ei) => {
              const ws = wishdays[emp.id] || new Set();
              return (
                <tr key={emp.id} style={{background:ei%2===0?C.surface:C.surface2}}>
                  <td style={{padding:DS.namePad,borderBottom:`1px solid ${C.border}`}}><div style={{fontWeight:600}}>{emp.name}</div></td>
                  {days.map(d => {
                    const k = dateKey(wy, wm, d), wished = ws.has(k);
                    return (
                      <td key={d} style={{padding:DS.dataPad,borderBottom:`1px solid ${C.border}`,textAlign:"center"}}>
                        <button onClick={() => toggleWish(emp.id, k)} style={{width:DS.btnSize,height:DS.btnSize,borderRadius:5,border:wished?`2px solid ${C.red}`:`1px solid ${C.border}`,background:wished?C.redBg:C.surface2,cursor:"pointer",fontSize:9,fontWeight:700,color:wished?C.red:C.border2}}>{wished?"希":""}</button>
                      </td>
                    );
                  })}
                  <td style={{textAlign:"center",color:C.red,fontWeight:700,borderBottom:`1px solid ${C.border}`}}>{ws.size>0?`${ws.size}件`:"—"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── アラートタブ ──────────────────────────────────────────
function AlertTab() {
  const { staffingAlerts, constraintAlerts, totalAlerts, month, SHIFT_TYPES } = useShift();
  const [section, setSection] = useState("all");
  return (
    <div>
      <div style={{display:"flex",gap:4,marginBottom:16,background:C.surface2,borderRadius:9,padding:3,border:`1px solid ${C.border}`,width:"fit-content"}}>
        {[["all","すべて",totalAlerts],["staffing","人員不足",staffingAlerts.length],["constraint","制約違反",constraintAlerts.length]].map(([key,label,cnt]) => (
          <button key={key} onClick={() => setSection(key)} style={{padding:"6px 14px",borderRadius:7,border:"none",background:section===key?C.accent:"transparent",color:section===key?"#fff":C.textSub,fontWeight:700,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>
            {label}{cnt>0&&<span style={{marginLeft:4,background:section===key?"rgba(255,255,255,0.3)":C.redBg,color:section===key?"#fff":C.red,borderRadius:8,padding:"1px 6px",fontSize:10,fontWeight:700}}>{cnt}</span>}

      </div>
      {(section==="all"||section==="staffing") && (
        <div style={{marginBottom:20}}>
          {section==="all" && <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>人員不足</div>}

// ── 従業員管理タブ ────────────────────────────────────────
function EmployeeTab() {
  const { staffList, setStaffList, stats, showMsg } = useShift();
  const [newName,       setNewName]       = useState("");
  const [newGender,     setNewGender]     = useState("female");
  const [newRole,       setNewRole]       = useState("正社員");

  const [editEmpName,   setEditEmpName]   = useState("");
  const [editEmpGender, setEditEmpGender] = useState("female");
  const [editEmpRole,   setEditEmpRole]   = useState("正社員");

  function addStaff() {
    if (!newName.trim()) return;
    const id = Date.now();
    setStaffList(prev => [
      ...prev,
      { id, name: newName.trim(), role: newRole, gender: newGender, color: COLORS[prev.length % COLORS.length] },
    ]);
    setNewName("");
    showMsg("✓ 追加しました");
  }

  function removeStaff(id) {
    setStaffList(prev => prev.filter(e => e.id !== id));
  }

  function saveEditEmp() {
    if (!editEmpName.trim()) return;
    setStaffList(prev => prev.map(e =>
      e.id === editEmpId
        ? { ...e, name: editEmpName.trim(), gender: editEmpGender, role: editEmpRole }
        : e
    ));
    setEditEmpId(null);
    showMsg("✓ 更新しました");

  return (

        <div><label style={S.label}>性別</label><select value={newGender} onChange={e=>setNewGender(e.target.value)} style={{...S.input,width:90}}><option value="female">女性</option><option value="male">男性</option></select></div>
        <button onClick={addStaff} style={{...S.btn(C.accent),alignSelf:"flex-end"}}>＋ 追加</button>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>

                {isEditing
                  ? <select value={editEmpRole} onChange={e=>setEditEmpRole(e.target.value)} style={{...S.input,width:80,fontSize:12,padding:"4px 8px"}}><option value="正社員">正社員</option><option value="パート">パート</option></select>
                  : <span style={{fontSize:11,color:emp.role==="パート"?"var(--badge-yakan-border)":"#475569",background:emp.role==="パート"?"var(--badge-yakan-bg)":C.surface2,borderRadius:4,padding:"1px 7px",border:`1px solid ${emp.role==="パート"?"#c4b5fd":C.border2}`}}>{emp.role}</span>

                {isEditing
                  ? <select value={editEmpGender} onChange={e=>setEditEmpGender(e.target.value)} style={{...S.input,width:80,fontSize:12,padding:"4px 8px"}}><option value="female">女性</option><option value="male">男性</option></select>
                  : <span style={{fontSize:11,color:emp.gender==="female"?"var(--badge-hayaC-border)":"#1d4ed8",background:emp.gender==="female"?"var(--badge-hayaC-bg)":C.accentBg,borderRadius:4,padding:"1px 7px",border:`1px solid ${emp.gender==="female"?"#fda4af":"#93c5fd"}`}}>{emp.gender==="female"?"女性":"男性"}</span>
                }

      </div>

// ── 必要人数タブ ──────────────────────────────────────────
function RequiredTab() {
  const { customShifts, setCustomShifts, required, setRequired,
          orderConstraints, setOrderConstraints, fixedRules, setFixedRules,
          staffList, showMsg, SHIFT_TYPES } = useShift();
  const [editKey,       setEditKey]       = useState(null);
  const [editForm,      setEditForm]      = useState({ label:"", startH:9, endH:18 });
  const [newForm,       setNewForm]       = useState({ label:"", startH:9, endH:18 });
  const [fixedRuleForm, setFixedRuleForm] = useState({ empId:staffList[0]?.id||null, dow:1, shiftKey:customShifts[0]?.key||"" });
  const [showNewForm,   setShowNewForm]   = useState(false);

  function startEdit(s) {
    setEditKey(s.key);
    setEditForm({ label:s.label, startH:s.startH, endH:s.endH });
  }

  function saveEdit() {
    if (!editForm.label.trim()) return;
    const newKey = editForm.label.trim();
    setCustomShifts(prev => prev.map(s => {
      if (s.key !== editKey) return s;
      return { ...s, key:newKey, label:newKey, short:newKey.slice(0,1), startH:Number(editForm.startH), endH:Number(editForm.endH) };
    }));
    if (newKey !== editKey) {
      setRequired(prev => { const n={...prev}; n[newKey]=n[editKey]||0; delete n[editKey]; return n; });
      setOrderConstraints(prev => {
        const n={};
        Object.entries(prev).forEach(([k,v]) => { const nk=k===editKey?newKey:k; n[nk]=v.map(x=>x===editKey?newKey:x); });
        return n;
      });
    }
    setEditKey(null);
  }

  function addShift() {
    if (!newForm.label.trim()) return;
    const key = newForm.label.trim();
    if (customShifts.some(s => s.key===key)) { alert("同じ名前のシフトが既に存在します"); return; }
    const pc = PILL_COLORS[customShifts.length % PILL_COLORS.length];
    setCustomShifts(prev => [...prev, { key, label:key, short:key.slice(0,1), startH:Number(newForm.startH), endH:Number(newForm.endH), color:pc.color, bg:pc.bg, text:pc.text }]);
    setRequired(prev => ({ ...prev, [key]:1 }));
    setNewForm({ label:"", startH:9, endH:18 });
  }

  function deleteShift(key) {
    if (!window.confirm(`「${key}」を削除しますか？`)) return;
    setCustomShifts(prev => prev.filter(s => s.key!==key));
    setRequired(prev => { const n={...prev}; delete n[key]; return n; });
    setOrderConstraints(prev => {
      const n={};
      Object.entries(prev).forEach(([k,v]) => { if (k!==key) n[k]=v.filter(x=>x!==key); });
      return n;
    });
  }

  const sortedShifts = [...customShifts].sort((a,b) => a.startH-b.startH);

  return (
    <div>
      <p style={{color:C.textSub,fontSize:13,marginBottom:16}}>勤務形態の追加・編集・削除と、必要人数・順序制約を設定します。</p>

      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:24}}>
        {sortedShifts.map(s => {
          const t = SHIFT_TYPES[s.key];
          const isEdit = editKey === s.key;
          return (
            <div key={s.key} style={{...S.card,padding:"12px 16px",border:isEdit?`2px solid ${C.accent}`:`1px solid ${C.border}`}}>
              {isEdit ? (
                <div>
                  <div style={{marginBottom:12}}>
                    <label style={S.label}>名称</label>
                    <input value={editForm.label} onChange={e=>setEditForm(f=>({...f,label:e.target.value}))} style={{...S.input,width:110,minWidth:110,padding:"5px 8px"}}/>
                  </div>
                  <div style={{display:"flex",gap:20,flexWrap:"wrap",alignItems:"flex-start",marginBottom:14}}>
                    <TimePicker value={editForm.startH} onChange={v=>setEditForm(f=>({...f,startH:v}))} min={0} max={30} label="開始（時）"/>
                    <TimePicker value={editForm.endH}   onChange={v=>setEditForm(f=>({...f,endH:v}))}   min={1} max={31} label="終了（時）"/>
                    <div style={{display:"flex",flexDirection:"column",gap:6}}>
                      <label style={S.label}>必要人数</label>
                      <CountPicker value={required[s.key]||0} onChange={v=>setRequired(p=>({...p,[s.key]:v}))}/>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={saveEdit} style={{...S.btn(C.accent),padding:"7px 20px"}}>保存</button>
                    <button onClick={() => setEditKey(null)} style={{...S.btn(C.surface2,C.textSub),border:`1px solid ${C.border}`,padding:"7px 14px"}}>✕</button>
                  </div>
                </div>
              ) : (
                <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                  <div style={{minWidth:60}}><Pill type={s.key}/></div>
                  <div style={{fontSize:12,color:C.textSub,flex:1}}>
                    {fmt2(s.startH)}:00 〜 {s.endH>24?`翌${fmt2(s.endH-24)}:00`:`${fmt2(s.endH)}:00`}
                    {s.isFixedRule && <span style={{marginLeft:6,fontSize:10,color:"var(--badge-yakan-border)",background:"var(--badge-yakan-bg)",borderRadius:4,padding:"1px 5px",border:"1px solid #c4b5fd44"}}>固定</span>}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:11,color:C.textSub}}>必要</span>
                    <CountPicker value={required[s.key]||0} onChange={v=>setRequired(p=>({...p,[s.key]:v}))}/>
                    <span style={{fontSize:11,color:C.textSub}}>名</span>
                  </div>
                  {!s.isFixedRule && <button onClick={() => startEdit(s)} style={{...S.btn(C.surface,C.accent),border:`1px solid ${C.border}`,fontSize:12,padding:"4px 12px"}}>編集</button>}
                  {!s.isFixedRule && <button onClick={() => deleteShift(s.key)} style={{...S.btn(C.surface,C.red),border:`1px solid ${C.border}`,fontSize:12,padding:"4px 12px"}}>削除</button>}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{marginBottom:20}}>
        <button onClick={() => { setShowNewForm(true); setNewForm({label:"",startH:9,endH:18}); }} style={{...S.btn(C.green),padding:"8px 20px"}}>
          ＋ 新しい勤務形態を追加
        </button>
      </div>

      {showNewForm && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={() => setShowNewForm(false)}>
          <div style={{background:C.surface,borderRadius:14,padding:24,width:"92%",maxWidth:380,boxShadow:"0 8px 32px rgba(0,0,0,0.18)"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:800,fontSize:15,color:C.green,marginBottom:16}}>＋ 新しい勤務形態を追加</div>
            <div style={{marginBottom:14}}>
              <label style={S.label}>名称</label>
              <input value={newForm.label} onChange={e=>setNewForm(f=>({...f,label:e.target.value}))} placeholder="例：準夜勤" autoFocus style={{...S.input,width:"100%"}}/>
            </div>
            <div style={{display:"flex",gap:20,flexWrap:"wrap",marginBottom:20}}>
              <TimePicker value={newForm.startH} onChange={v=>setNewForm(f=>({...f,startH:v}))} min={0} max={30} label="開始（時）"/>
              <TimePicker value={newForm.endH}   onChange={v=>setNewForm(f=>({...f,endH:v}))}   min={1} max={31} label="終了（時）"/>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={() => setShowNewForm(false)} style={{...S.btn(C.surface2,C.textSub),border:`1px solid ${C.border}`}}>キャンセル</button>
              <button onClick={() => { addShift(); setShowNewForm(false); }} style={S.btn(C.green)}>追加</button>
            </div>
          </div>
        </div>
      )}

      <div style={{...S.card,padding:"16px",marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:14,color:C.text,marginBottom:4}}>📌 固定ルール</div>
        <p style={{fontSize:12,color:C.textSub,marginBottom:14}}>特定スタッフを特定の曜日・時間帯に固定。自動生成時に最優先で割り当てられます。登録したルールは勤務形態一覧にも追加表示されます。</p>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end",padding:"12px",background:C.accentBg,borderRadius:10,marginBottom:14,border:`1px solid ${C.accent}33`}}>
          <div style={{flex:1,minWidth:120}}>
            <label style={S.label}>スタッフ</label>
            <select value={fixedRuleForm.empId||""} onChange={e=>setFixedRuleForm(f=>({...f,empId:Number(e.target.value)}))} style={{...S.input,width:"100%"}}>

          <TimePicker value={fixedRuleForm.endH??18}  onChange={v=>setFixedRuleForm(f=>({...f,endH:v}))}  min={1} max={31} label="終了（時）"/>
          <button onClick={() => {

            const endH   = fixedRuleForm.endH??18;
            const timeStr = `${fmt2(startH)}:00-${endH>24?`翌${fmt2(endH-24)}:00`:`${fmt2(endH)}:00`}`;
            const ruleName = `${emp?.name.split(" ")[0]}_${DOW[fixedRuleForm.dow]}_${timeStr}`;
            const matchShift = customShifts.find(s => s.startH===startH && s.endH===endH);
            const newRule = { id:Date.now(), ...fixedRuleForm, startH, endH, shiftKey:matchShift?.key||ruleName, displayName:ruleName };
            setFixedRules(prev => [...prev, newRule]);
            if (!customShifts.some(s=>s.key===ruleName) && !matchShift) {
              const pc = PILL_COLORS[customShifts.length % PILL_COLORS.length];
              setCustomShifts(prev => [...prev, { key:ruleName, label:ruleName, short:ruleName.slice(0,2), startH, endH, color:pc.color, bg:pc.bg, text:pc.text, isFixedRule:true }]);
              setRequired(prev => ({ ...prev, [ruleName]:1 }));
            }
            showMsg("✓ 固定ルールを追加しました");
          }} style={{...S.btn(C.accent),padding:"7px 18px",alignSelf:"flex-end"}}>追加</button>
        </div>
        {fixedRules.length===0 ? (
          <div style={{textAlign:"center",padding:"20px",color:C.textMute,background:C.surface2,borderRadius:10,border:`1.5px dashed ${C.border}`}}>
            <div style={{fontSize:18,marginBottom:4}}>📌</div>
            <div style={{fontSize:12}}>固定ルールがまだありません</div>
          </div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {fixedRules.map(rule => {
              const emp = staffList.find(e => e.id===rule.empId);
              if (!emp) return null;
              const sh=rule.startH??0, eh=rule.endH??0;
              const timeStr = `${fmt2(sh)}:00〜${eh>24?`翌${fmt2(eh-24)}:00`:`${fmt2(eh)}:00`}`;
              return (
                <div key={rule.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:C.surface2,borderRadius:9,border:`1px solid ${C.border}`,flexWrap:"wrap"}}>
                  <span style={{width:8,height:8,borderRadius:"50%",background:emp.color,flexShrink:0}}/>
                  <span style={{fontWeight:700,fontSize:12,flex:1}}>{emp.name}</span>
                  <span style={{fontSize:11,color:C.textSub,background:C.surface,borderRadius:6,padding:"2px 8px",border:`1px solid ${C.border}`}}>{DOW[rule.dow]}曜日</span>
                  <span style={{fontSize:11,fontWeight:700,color:C.accent,background:C.accentBg,borderRadius:6,padding:"2px 8px",border:`1px solid ${C.accent}44`}}>{timeStr}</span>
                  {rule.displayName && <span style={{fontSize:10,color:C.textMute,background:C.surface,borderRadius:5,padding:"1px 6px",border:`1px solid ${C.border}`}}>→ {rule.displayName}</span>}
                  <button onClick={() => {
                    setFixedRules(prev => prev.filter(r => r.id!==rule.id));
                    if (rule.displayName) setCustomShifts(prev => prev.filter(s => s.key!==rule.displayName));
                  }} style={{...S.btn(C.surface,C.red),border:`1px solid ${C.border}`,fontSize:11,padding:"2px 10px",flexShrink:0}}>削除</button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={S.card}>
        <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>順序制約</div>
        <div style={{overflowX:"auto"}}>
          <table style={{borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr>
                <th style={{...S.th(80),textAlign:"left",paddingLeft:8}}>前日↓ 翌日→</th>
                {customShifts.map(s => <th key={s.key} style={S.th(60)}><Pill type={s.key} small/></th>)}
              </tr>
            </thead>
            <tbody>
              {customShifts.map((from, fi) => (
                <tr key={from.key} style={{background:fi%2===0?C.surface:C.surface2}}>
                  <td style={{padding:"6px 8px",borderBottom:`1px solid ${C.border}`}}><Pill type={from.key}/></td>
                  {customShifts.map(to => {
                    const isSelf = from.key===to.key, isOn = (orderConstraints[from.key]||[]).includes(to.key);
                    return (
                      <td key={to.key} style={{textAlign:"center",padding:"6px 4px",borderBottom:`1px solid ${C.border}`}}>
                        {isSelf ? <span style={{color:C.textMute}}>—</span> : (
                          <button onClick={() => setOrderConstraints(prev => { const cur=prev[from.key]||[]; return {...prev,[from.key]:isOn?cur.filter(x=>x!==to.key):[...cur,to.key]}; })}
                            style={{width:32,height:28,borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:11,border:isOn?`2px solid ${C.red}`:`1px solid ${C.border}`,background:isOn?C.redBg:C.surface,color:isOn?C.red:C.textMute,fontFamily:"inherit"}}>
                            {isOn?"✕":""}
                          </button>
                        )}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:8,fontSize:11,color:C.textMute}}>✕ = 前日のシフトの翌日には入れない</div>
      </div>
    </div>
  );
}

// ── 個人ビュータブ ────────────────────────────────────────
function PersonalTab() {
  const { staffList, staffShifts, stats, editCell, setEditCell,
          year, month, daysInMonth, today, SHIFT_TYPES, SHIFT_HOURS } = useShift();
  const [personalId, setPersonalId] = useState(INITIAL_STAFF[0]?.id || null);
  const emp = staffList.find(e => e.id === personalId);
  const st  = stats.find(s => s.id === personalId);
  const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);
  if (!emp) return <div style={{color:C.textMute}}>従業員が登録されていません</div>;

  // 円グラフデータ
  const pieCounts = {};
  days.forEach(d => {
    const raw = staffShifts[emp.id]?.[d] || "休み";
    const key = ["休み","希望休"].includes(raw) ? "休日" : raw;
    pieCounts[key] = (pieCounts[key] || 0) + 1;
  });
  const pieSlices = Object.entries(pieCounts)
    .map(([key, count]) => {
      const t = key === "休日"
        ? { color:"#cbd5e1" }
        : (SHIFT_TYPES[key] || { color:"#cbd5e1" });
      return { key, count, color: t.color };
    })
    .sort((a, b) => b.count - a.count);
  const PIE_R=68, PIE_CX=80, PIE_CY=80;
  let pieAng = -Math.PI / 2;
  const piePaths = pieSlices.map(s => {
    const frac = s.count / daysInMonth;
    const sw   = frac * 2 * Math.PI;
    const sa   = pieAng, ea = pieAng + sw;
    pieAng = ea;
    if (frac >= 1) return { ...s, frac, full:true };
    const x1=(PIE_CX+PIE_R*Math.cos(sa)).toFixed(2), y1=(PIE_CY+PIE_R*Math.sin(sa)).toFixed(2);
    const x2=(PIE_CX+PIE_R*Math.cos(ea)).toFixed(2), y2=(PIE_CY+PIE_R*Math.sin(ea)).toFixed(2);
    return { ...s, frac, full:false,
      d:`M${PIE_CX} ${PIE_CY}L${x1} ${y1}A${PIE_R} ${PIE_R} 0 ${sw>Math.PI?1:0} 1 ${x2} ${y2}Z` };
  });

  return (
    <div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
        {staffList.map(e => (
          <button key={e.id} onClick={() => setPersonalId(e.id)} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",borderRadius:9,border:personalId===e.id?`2px solid ${e.color}`:`1px solid ${C.border}`,background:personalId===e.id?`${e.color}11`:C.surface,color:personalId===e.id?C.text:C.textSub,cursor:"pointer",fontSize:12,fontWeight:personalId===e.id?700:400,fontFamily:"inherit"}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:e.color}}/>{e.name}
          </button>
        ))}
      </div>
      <div style={{...S.card,marginBottom:16,display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:40,height:40,borderRadius:"50%",background:emp.color,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:900,fontSize:16}}>{emp.name.charAt(0)}</div>
          <div><div style={{fontWeight:800,fontSize:16}}>{emp.name}</div><div style={{fontSize:11,color:C.textMute}}>{emp.role}</div></div>
        </div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          {[[st?.workDays??0,"勤務日",st?.daysOk],[`${st?.workHours??0}h`,"勤務時間",st?.hoursOk],[st?.wishOff??0,"希望休",null]].map(([val,label,ok],i) => (
            <div key={i} style={{textAlign:"center",padding:"6px 14px",background:ok===null?C.redBg:ok?C.greenBg:C.amberBg,borderRadius:10}}>
              <div style={{fontSize:22,fontWeight:900,color:ok===null?C.red:ok?C.green:C.amber,lineHeight:1}}>{val}</div>
              <div style={{fontSize:10,color:C.textSub}}>{label}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>月間シフト — {year}年{month+1}月</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:4}}>
        {DOW.map((d,i) => <div key={i} style={{textAlign:"center",fontSize:11,fontWeight:700,color:i===0?"var(--color-sunday)":i===6?"var(--color-saturday)":C.textMute,padding:"4px 0"}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {Array.from({length:getDow(year,month,1)},(_,i) => <div key={`e${i}`}/>)}
        {days.map(d => {
          const dow  = getDow(year, month, d);
          const type = staffShifts[emp.id]?.[d] || "休み";
          const t    = SHIFT_TYPES[type] || FIXED_TYPES["休み"];
          const isToday = d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
          const isOff   = ["休み","希望休"].includes(type);
          const cid = `p-${emp.id}-${d}`, isOpen = editCell === cid;
          return (
            <div key={d} style={{position:"relative"}}>
              <button onClick={() => setEditCell(isOpen ? null : cid)} style={{width:"100%",minHeight:52,borderRadius:9,cursor:"pointer",border:isToday?`2px solid ${C.accent}`:`1px solid ${isOff?C.border:t.color+"55"}`,background:isOff?C.surface2:t.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,padding:"3px 2px",fontFamily:"inherit"}}>
                <div style={{fontSize:13,fontWeight:700,color:dow===0?"var(--color-sunday)":dow===6?"var(--color-saturday)":C.text}}>{d}</div>
                <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",padding:"2px 6px",borderRadius:5,fontSize:10,fontWeight:700,background:t.bg,color:t.text,border:`1px solid ${t.color}55`}}>{t.short}</span>
              </button>
              {isOpen && (
                <div style={{position:"absolute",top:"100%",left:"50%",transform:"translateX(-50%)",zIndex:200}}>
                  <CellPicker empId={emp.id} dayKey={d} onClose={() => setEditCell(null)}/>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{...S.card,marginTop:16}}>
        <div style={{fontWeight:700,fontSize:13,marginBottom:14}}>シフト内訳</div>
        <div style={{display:"flex",gap:24,alignItems:"center",flexWrap:"wrap"}}>
          <svg width="160" height="160" viewBox="0 0 160 160" style={{flexShrink:0}}>
            {piePaths.map(s => s.full
              ? <circle key={s.key} cx={PIE_CX} cy={PIE_CY} r={PIE_R} fill={s.color}/>
              : <path   key={s.key} d={s.d} fill={s.color} stroke="#fff" strokeWidth="2"/>
            )}
          </svg>
          <div style={{display:"flex",flexDirection:"column",gap:8,flex:1,minWidth:140}}>
            {piePaths.map(s => (
              <div key={s.key} style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{width:12,height:12,borderRadius:3,background:s.color,flexShrink:0,border:`1px solid ${s.color}88`}}/>
                <span style={{fontSize:12,fontWeight:600,flex:1,color:C.text}}>{s.key}</span>
                <span style={{fontSize:12,color:C.textSub,fontWeight:700}}>{s.count}日</span>
                <span style={{fontSize:11,color:C.textMute,minWidth:38,textAlign:"right"}}>{Math.round(s.frac*100)}%</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function CandidatesModal({ candidates, onAdopt, onClose, onRegenerate }) {
  const { customShifts, SHIFT_TYPES } = useShift();
  const [genCount, setGenCount] = useState(5);

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.55)",zIndex:400,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"20px 12px",overflowY:"auto"}} onClick={onClose}>
      <div style={{background:C.surface,borderRadius:16,padding:"20px 22px",width:"100%",maxWidth:620,boxShadow:"0 20px 60px rgba(0,0,0,0.25)"}} onClick={e=>e.stopPropagation()}>

        {/* ヘッダー */}
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:18,flexWrap:"wrap"}}>
          <div style={{fontWeight:900,fontSize:15,marginRight:4}}>🎲 候補シフト一覧</div>
          <div style={{fontSize:11,color:C.textSub,flex:1}}>アラートの少ない順に表示</div>
          <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
            <span style={{fontSize:11,color:C.textSub}}>生成数:</span>
            {[3,5,10].map(n => (
              <button key={n} onClick={() => setGenCount(n)}
                style={{padding:"4px 10px",borderRadius:6,border:genCount===n?`2px solid ${C.accent}`:`1px solid ${C.border}`,background:genCount===n?C.accentBg:C.surface2,color:genCount===n?C.accent:C.textSub,fontWeight:genCount===n?700:400,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>
                {n}
              </button>
            ))}
            <button onClick={() => onRegenerate(genCount)} style={{...S.btn(C.accent),padding:"5px 12px",fontSize:12}}>再生成</button>
            <button onClick={onClose} style={{...S.btn(C.surface2,C.textSub),border:`1px solid ${C.border}`,padding:"5px 12px",fontSize:12}}>閉じる</button>
          </div>
        </div>

        {/* 候補リスト */}
        {candidates.length === 0 ? (
          <div style={{textAlign:"center",padding:"40px",color:C.textMute,background:C.surface2,borderRadius:10}}>候補がありません</div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {candidates.map((cand, i) => {
              const isTop  = i === 0;
              const total  = cand.alerts.total;
              const aColor = total === 0 ? C.green : total < 5 ? C.amber : C.red;
              const aBg    = total === 0 ? C.greenBg : total < 5 ? C.amberBg : C.redBg;

              // シフト別過不足サマリ
              const shiftSummary = customShifts.map(s => {
                const days = cand.daysInMonth;
                let shortage = 0, days_short = 0;
                for (let d=1; d<=days; d++) {
                  const needed = cand.requiredMap[s.key] || 0;
                  const actual = cand.staffList.filter(e => cand.shifts[e.id]?.[d] === s.key).length;
                  if (actual < needed) { shortage += needed - actual; days_short++; }
                }
                return { key:s.key, shortage, days_short };
              }).filter(x => x.shortage > 0);

              return (
                <div key={i} style={{borderRadius:12,border:isTop?`2px solid ${C.green}`:`1px solid ${C.border}`,padding:"14px 16px",background:isTop?`${C.green}0a`:C.surface,position:"relative"}}>
                  {isTop && <div style={{position:"absolute",top:-10,left:16,background:C.green,color:"#fff",fontSize:9,fontWeight:800,borderRadius:5,padding:"2px 9px",letterSpacing:"0.04em"}}>BEST</div>}
                  <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                    <div style={{fontWeight:800,fontSize:20,color:isTop?C.green:C.textMute,minWidth:32}}>#{i+1}</div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:shiftSummary.length?6:0}}>
                        <span style={{padding:"4px 12px",borderRadius:8,fontSize:12,fontWeight:700,background:aBg,color:aColor,border:`1px solid ${aColor}33`}}>
                          {total === 0 ? "✓ アラートなし" : `⚠ ${total}件`}
                        </span>
                        {total > 0 && <>
                          <span style={{fontSize:11,color:C.textSub}}>人員不足 {cand.alerts.staffingCount}件</span>
                          <span style={{fontSize:11,color:C.textSub}}>制約違反 {cand.alerts.constraintCount}件</span>
                        </>}
                      </div>
                      {shiftSummary.length > 0 && (
                        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                          {shiftSummary.map(x => {
                            const t = SHIFT_TYPES[x.key];
                            return (
                              <span key={x.key} style={{fontSize:10,padding:"1px 7px",borderRadius:5,background:t?.bg||C.surface2,color:t?.text||C.textSub,border:`1px solid ${t?.color||C.border}55`}}>
                                {x.key}: {x.days_short}日不足
                              </span>
                            );
                          })}
                        </div>
                      )}
                    </div>
                    <button onClick={() => { onAdopt(cand); onClose(); }}
                      style={{...S.btn(isTop?C.green:C.accent),padding:"8px 20px",flexShrink:0}}>
                      採用
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ── メインアプリ ───────────────────────────────────────────
function App() {
  const today = new Date();

  const saved = (() => {
    try { return JSON.parse(localStorage.getItem("shift_app_v1") || "{}"); }
    catch (e) { return {}; }
  })();

  const toSetMap = obj =>
    Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, new Set(v)]));

  const [currentDate,      setCurrentDate]      = useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const [view,             setView]             = useState("month");
  const [tab,              setTab]              = useState("shift");
  const [staffList,        setStaffList]        = useState(saved.staffList || INITIAL_STAFF);
  const [staffShifts,      setStaffShifts]      = useState(saved.staffShifts || {});
  const [wishdays,         setWishdays]         = useState(() => toSetMap(saved.wishdays || {}));
  const [constraints,      setConstraints]      = useState(saved.constraints || {});
  const [required,         setRequired]         = useState(saved.required || DEFAULT_REQUIRED);
  const [customShifts,     setCustomShifts]     = useState(saved.customShifts || INITIAL_SHIFTS);
  const [orderConstraints, setOrderConstraints] = useState(saved.orderConstraints || ORDER_CONSTRAINTS_DEFAULT);
  const [editCell,         setEditCell]         = useState(null);
  const [lockedCells,      setLockedCells]      = useState(() => toSetMap(saved.lockedCells || {}));
  const [savedMonths,      setSavedMonths]      = useState(saved.savedMonths || {});
  const [fixedRules,       setFixedRules]       = useState(saved.fixedRules || []);
  const [msg,              setMsg]              = useState("");
  const [candidates,       setCandidates]       = useState([]);
  const [showCandidates,   setShowCandidates]   = useState(false);
  const [printModal,       setPrintModal]       = useState(null);
  const [staffSearch,      setStaffSearch]      = useState("");
  const [staffFilter,      setStaffFilter]      = useState("all");
  const [density,          setDensity]          = useState("standard");

  const SHIFT_TYPES = useMemo(() => {
    const obj = {};
    customShifts.forEach(s => {
      const endLabel = s.endH > 24 ? `翌${fmt2(s.endH - 24)}:00` : `${fmt2(s.endH)}:00`;
      obj[s.key] = { label:s.label, short:s.short, hours:`${fmt2(s.startH)}:00-${endLabel}`, color:s.color, bg:s.bg, text:s.text };
    });
    return { ...obj, ...FIXED_TYPES };
  }, [customShifts]);

  const SHIFT_HOURS = useMemo(() => {
    const obj = { 休み:0, 希望休:0 };
    customShifts.forEach(s => { obj[s.key] = s.endH - s.startH; });
    return obj;
  }, [customShifts]);

  const year        = currentDate.getFullYear();
  const month       = currentDate.getMonth();
  const daysInMonth = getDaysInMonth(year, month);
  const weekDates   = getWeekDates(currentDate);

  const showMsg = message => {
    setMsg(message);
    setTimeout(() => setMsg(""), 3000);
  };

  useEffect(() => {
    try {
      const data = {
        staffList, staffShifts, constraints, required,
        customShifts, orderConstraints, savedMonths, fixedRules,
        wishdays:    Object.fromEntries(Object.entries(wishdays).map(([k,v]) => [k,[...v]])),
        lockedCells: Object.fromEntries(Object.entries(lockedCells).map(([k,v]) => [k,[...v]])),
      };
      localStorage.setItem("shift_app_v1", JSON.stringify(data));
    } catch (e) {}
  }, [staffList, staffShifts, wishdays, constraints, required,
      customShifts, orderConstraints, lockedCells, savedMonths, fixedRules]);

  const stats = useMemo(() => staffList.map(emp => {
    const shifts    = staffShifts[emp.id] || {};
    const values    = Object.values(shifts);
    const isWork    = v => !["休み","希望休"].includes(v);
    const workDays  = values.filter(isWork).length;
    const workHours = values.reduce((acc, v) => acc + (SHIFT_HOURS[v] || 0), 0);
    const wishOff   = values.filter(v => v === "希望休").length;
    const c         = constraints[emp.id] || DEFAULT_CONSTRAINTS;
    return { ...emp, workDays, workHours, wishOff, daysOk:workDays>=c.minWorkDays&&workDays<=c.maxWorkDays, hoursOk:workHours>=c.minWorkHours&&workHours<=c.maxWorkHours };
  }), [staffList, staffShifts, constraints, SHIFT_HOURS]);

  const filteredStaffList = useMemo(() => {
    let list = staffList;
    if (staffFilter !== "all") list = list.filter(e => e.role === staffFilter);
    if (staffSearch.trim()) {
      const q = staffSearch.trim().toLowerCase();
      list = list.filter(e => e.name.toLowerCase().includes(q));
    }
    return list;
  }, [staffList, staffSearch, staffFilter]);

  const staffingAlerts = useMemo(() => {
    const alerts = [];
    for (let d=1; d<=daysInMonth; d++) {
      const dow = getDow(year, month, d);
      customShifts.forEach(s => {
        const needed = required[s.key] || 0;
        if (!needed) return;
        const actual = staffList.filter(emp => staffShifts[emp.id]?.[d] === s.key).length;
        if (actual < needed) alerts.push({ d, dow, shiftKey:s.key, needed, actual, shortage:needed-actual });
      });
    }
    return alerts;
  }, [staffShifts, required, customShifts, staffList, year, month, daysInMonth]);

  const constraintAlerts = useMemo(() => {
    const alerts = [];
    staffList.forEach(emp => {
      const shifts    = staffShifts[emp.id] || {};
      const c         = constraints[emp.id] || DEFAULT_CONSTRAINTS;
      const isWork    = v => !["休み","希望休"].includes(v);
      const workDays  = Object.values(shifts).filter(isWork).length;
      const workHours = Object.values(shifts).reduce((acc, v) => acc + (SHIFT_HOURS[v] || 0), 0);
      const reasons   = [];
      if (workDays  < c.minWorkDays)  reasons.push(`勤務日数不足 (${workDays}/${c.minWorkDays}日)`);
      if (workDays  > c.maxWorkDays)  reasons.push(`勤務日数超過 (${workDays}/${c.maxWorkDays}日)`);
      if (workHours < c.minWorkHours) reasons.push(`勤務時間不足 (${workHours}h/${c.minWorkHours}h)`);
      if (workHours > c.maxWorkHours) reasons.push(`勤務時間超過 (${workHours}h/${c.maxWorkHours}h)`);
      let maxConsec = 0, cur = 0;
      for (let d=1; d<=daysInMonth; d++) {
        if (isWork(shifts[d]||"休み")) { cur++; maxConsec=Math.max(maxConsec,cur); } else { cur=0; }
      }
      if (maxConsec > c.maxConsecutive) reasons.push(`連続勤務超過 (${maxConsec}連勤/${c.maxConsecutive}日上限)`);
      for (let d=2; d<=daysInMonth; d++) {
        const prev=shifts[d-1], cur2=shifts[d];
        if (prev && cur2 && (orderConstraints[prev]||[]).includes(cur2)) reasons.push(`順序違反: ${d-1}日${prev}→${d}日${cur2}`);
      }
      if (reasons.length) alerts.push({ emp, workDays, workHours, reasons });
    });
    return alerts;
  }, [staffList, staffShifts, constraints, SHIFT_HOURS, year, month, daysInMonth, orderConstraints]);

  const totalAlerts = staffingAlerts.length + constraintAlerts.length;

  const prevTailCount = useMemo(() => {
    const max = staffList.reduce((a, emp) => {
      const c = constraints[emp.id] || DEFAULT_CONSTRAINTS;
      return Math.max(a, c.maxConsecutive);
    }, DEFAULT_CONSTRAINTS.maxConsecutive);
    return Math.max(1, max - 1);
  }, [staffList, constraints]);

  const prevMonthTail = useMemo(() => {
    const prevYear  = month===0 ? year-1 : year;
    const prevMonth = month===0 ? 12 : month;
    const key = `${prevYear}-${prevMonth}`;
    const saved2 = savedMonths[key];
    if (!saved2) return null;
    const prevDays = getDaysInMonth(prevYear, prevMonth-1);
    const tail = {};
    staffList.forEach(emp => {
      tail[emp.id] = {};
      for (let i=0; i<prevTailCount; i++) {
        const d = prevDays - i;
        if (d >= 1) tail[emp.id][d] = saved2[emp.id]?.[d] || "休み";
      }
    });
    return { shifts:tail, totalDays:prevDays, tailCount:prevTailCount };
  }, [savedMonths, year, month, staffList, prevTailCount]);

  // アクション
  function toggleCellLock(empId, day) {
    setLockedCells(prev => {
      const next = new Set(prev[empId] || []);
      next.has(day) ? next.delete(day) : next.add(day);
      return { ...prev, [empId]:next };
    });
  }

  function toggleAllLock(empId) {
    setLockedCells(prev => {
      const allDays  = Array.from({ length:daysInMonth }, (_, i) => i+1);
      const current  = prev[empId] || new Set();
      const allLocked = allDays.every(d => current.has(d));
      return { ...prev, [empId]:allLocked ? new Set() : new Set(allDays) };
    });
  }

  function setCellShift(empId, day, type) {
    setStaffShifts(prev => ({ ...prev, [empId]:{ ...(prev[empId]||{}), [day]:type } }));
    setEditCell(null);
  }

  function toggleWish(empId, key) {
    setWishdays(prev => {
      const next = new Set(prev[empId] || []);
      next.has(key) ? next.delete(key) : next.add(key);
      return { ...prev, [empId]:next };
    });
  }

  function runAutoGenerate() {
    const lockedInitial = {};
    staffList.forEach(emp => {
      const locked = lockedCells[emp.id] || new Set();
      lockedInitial[emp.id] = {};
      locked.forEach(d => { const cur=staffShifts[emp.id]?.[d]; if (cur) lockedInitial[emp.id][d]=cur; });
    });
    const gen = autoGenerate(staffList, year, month, wishdays, constraints, required, SHIFT_HOURS, customShifts, orderConstraints, lockedInitial, prevMonthTail, fixedRules);
    setStaffShifts(prev => {
      const next = {...prev};
      staffList.forEach(emp => { next[emp.id] = gen[emp.id] || {}; });
      return next;
    });
    showMsg("✓ シフトを自動生成しました");
  }

  function runCandidateGeneration(n = 5) {
    const lockedInitial = {};
    staffList.forEach(emp => {
      const locked = lockedCells[emp.id] || new Set();
      lockedInitial[emp.id] = {};
      locked.forEach(d => { const cur=staffShifts[emp.id]?.[d]; if (cur) lockedInitial[emp.id][d]=cur; });
    });

    const results = [];
    for (let i=0; i<n; i++) {
      const gen = autoGenerate(staffList, year, month, wishdays, constraints, required, SHIFT_HOURS, customShifts, orderConstraints, lockedInitial, prevMonthTail, fixedRules);
      const alerts = computeAlertsForShifts(gen, staffList, customShifts, required, constraints, SHIFT_HOURS, orderConstraints, year, month, daysInMonth);
      results.push({ shifts:gen, alerts, daysInMonth, staffList, requiredMap:required });
    }

    results.sort((a, b) => a.alerts.total - b.alerts.total);

    const seen = new Set();
    const unique = results.filter(r => {
      const fp = staffList.slice(0,4).map(e =>
        Array.from({length:Math.min(7,daysInMonth)},(_,d)=>r.shifts[e.id]?.[d+1]||"").join(",")
      ).join("|");
      if (seen.has(fp)) return false;
      seen.add(fp);
      return true;
    });

    setCandidates(unique);
    setShowCandidates(true);
    showMsg(`✓ ${unique.length}件の候補を生成しました`);
  }

  function adoptCandidate(candidate) {
    setStaffShifts(prev => {
      const next = {...prev};
      staffList.forEach(emp => { next[emp.id] = candidate.shifts[emp.id] || {}; });

  function importData() {
    const input = document.createElement("input");
    input.type  = "file";
    input.accept = ".json";
    input.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          if (d.staffList)        setStaffList(d.staffList);
          if (d.staffShifts)      setStaffShifts(d.staffShifts);
          if (d.constraints)      setConstraints(d.constraints);
          if (d.required)         setRequired(d.required);
          if (d.customShifts)     setCustomShifts(d.customShifts);
          if (d.orderConstraints) setOrderConstraints(d.orderConstraints);
          if (d.savedMonths)      setSavedMonths(d.savedMonths);
          if (d.fixedRules)       setFixedRules(d.fixedRules);
          if (d.wishdays)         setWishdays(toSetMap(d.wishdays));

          showMsg("✓ インポートしました");

    orderConstraints, setOrderConstraints,
    editCell, setEditCell,
    lockedCells, setLockedCells,
    fixedRules, setFixedRules,
    savedMonths, setSavedMonths,
    year, month, daysInMonth, weekDates, today,
    SHIFT_TYPES, SHIFT_HOURS,
    stats, staffingAlerts, constraintAlerts, totalAlerts,
    prevMonthTail,
    showMsg,
    toggleCellLock, toggleAllLock, setCellShift, toggleWish,
    density, setDensity,
  };

  return (
    <ShiftContext.Provider value={contextValue}>
      <div style={{fontFamily:"'Noto Sans JP',sans-serif",background:C.bg,minHeight:"100vh",color:C.text}} onClick={() => editCell && setEditCell(null)}>
        <div style={{background:"#FFFFFF",borderBottom:"1px solid #E2E5EA",boxShadow:"0 1px 3px rgba(20,20,30,0.06)"}}>
          {/* トップバー: ロゴ左・ボタン右 */}
          <div style={{display:"flex",alignItems:"center",gap:20,padding:"12px 16px 10px",flexWrap:"wrap"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:36,height:36,background:"#1B1D1F",color:"#fff",borderRadius:9,display:"grid",placeItems:"center",fontWeight:700,fontSize:15,letterSpacing:"-0.02em",flexShrink:0}}>S</div>
              <span style={{fontSize:17,fontWeight:600,color:"#1B1D1F",letterSpacing:"-0.01em"}}>勤務表</span>
            </div>
            <div style={{display:"flex",gap:10,marginLeft:"auto",alignItems:"center",flexWrap:"wrap"}}>
              <button onClick={() => setPrintModal({type:"preview"})}  style={{display:"inline-flex",alignItems:"center",gap:8,height:40,padding:"0 16px",borderRadius:10,border:"1px solid transparent",background:"transparent",color:"#4A4D52",fontSize:14,fontWeight:500,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"}}><Icons.Printer size={16}/>プレビュー</button>
              <button onClick={() => setPrintModal({type:"calendar"})} style={{display:"inline-flex",alignItems:"center",gap:8,height:40,padding:"0 16px",borderRadius:10,border:"1px solid transparent",background:"transparent",color:"#4A4D52",fontSize:14,fontWeight:500,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"}}><Icons.Calendar size={16}/>カレンダー</button>
              <button onClick={importData}                             style={{display:"inline-flex",alignItems:"center",gap:8,height:40,padding:"0 16px",borderRadius:10,border:"1px solid transparent",background:"transparent",color:"#4A4D52",fontSize:14,fontWeight:500,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"}}><Icons.Upload size={16}/>読込</button>
              <div style={{width:1,height:28,background:"#E2E5EA"}}/>
              <button onClick={exportData}                             style={{display:"inline-flex",alignItems:"center",gap:8,height:40,padding:"0 16px",borderRadius:10,border:"1px solid #C9CED6",background:"#FFFFFF",color:"#1B1D1F",fontSize:14,fontWeight:500,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"}}><Icons.Save size={16}/>保存</button>
              <button onClick={confirmAndNextMonth}                    style={{display:"inline-flex",alignItems:"center",gap:8,height:40,padding:"0 16px",borderRadius:10,border:"1px solid #C9CED6",background:"#FFFFFF",color:"#1B1D1F",fontSize:14,fontWeight:500,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"}}><Icons.CheckCircle size={16}/>確定して翌月へ</button>
              <button onClick={() => runCandidateGeneration(5)}        style={{display:"inline-flex",alignItems:"center",gap:8,height:40,padding:"0 16px",borderRadius:10,border:"1px solid #C9CED6",background:"#FFFFFF",color:"#1B1D1F",fontSize:14,fontWeight:500,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"}}><Icons.Dice size={16}/>候補生成</button>
              <button onClick={runAutoGenerate}                        style={{display:"inline-flex",alignItems:"center",gap:8,height:44,padding:"0 22px",borderRadius:11,border:"none",background:"#2E5BFF",color:"#FFFFFF",fontSize:14,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"}}><Icons.Bolt size={18}/>自動生成</button>
            </div>
          </div>
          {msg && <div style={{padding:"0 16px 6px"}}><span style={{fontSize:11,color:"#1E8A5F",fontWeight:700,background:"#DDF5E5",borderRadius:6,padding:"3px 10px",border:"1px solid #93D9AE"}}>{msg}</span></div>}
          {/* タブ（アンダーライン式） */}
          <div style={{display:"flex",gap:0,overflowX:"auto",padding:"0 12px",borderTop:"1px solid #E2E5EA"}}>
            {TABS.map(([key,label,activeColor,,iconName]) => {
              const isActive = tab===key;
              const alertCount = key==="alert" ? totalAlerts : 0;
              const TabIcon = iconName && Icons[iconName];
              return (
                <button key={key} onClick={() => setTab(key)}
                  style={{display:"inline-flex",alignItems:"center",gap:5,padding:"10px 16px",border:"none",borderBottom:isActive?`2px solid ${activeColor}`:"2px solid transparent",background:"transparent",color:isActive?activeColor:"#4A4D52",fontWeight:isActive?700:500,cursor:"pointer",fontSize:12,borderRadius:0,whiteSpace:"nowrap",fontFamily:"inherit",transition:"color 0.15s, border-color 0.15s"}}>
                  {TabIcon && <TabIcon size={13}/>}
                  {label}
                  {alertCount>0 && <span style={{marginLeft:4,background:"#FCE0E2",color:"#9B1F2A",borderRadius:10,padding:"1px 6px",fontSize:10,fontWeight:700}}>{alertCount}</span>}
                </button>
              );
            })}
          </div>
        </div>
        <div style={{background:C.surface,margin:"16px",borderRadius:14,border:`1px solid ${C.border}`,boxShadow:"0 2px 8px rgba(0,0,0,0.05)",padding:20}}>
          {tab==="shift" && (
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",gap:6,background:C.surface2,borderRadius:9,padding:"4px 8px",border:`1px solid ${C.border}`,height:36}}>
                <button onClick={() => { if(view==="week"){const nd=new Date(currentDate);nd.setDate(nd.getDate()-7);setCurrentDate(nd);}else setCurrentDate(new Date(year,month-1,1)); }} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:C.textSub,padding:"0 4px"}}>‹</button>
                <span style={{fontWeight:800,fontSize:14,minWidth:170,textAlign:"center"}}>{headerLabel}</span>
                <button onClick={() => { if(view==="week"){const nd=new Date(currentDate);nd.setDate(nd.getDate()+7);setCurrentDate(nd);}else setCurrentDate(new Date(year,month+1,1)); }} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:C.textSub,padding:"0 4px"}}>›</button>
              </div>
              <div style={{display:"flex",gap:3,background:C.surface2,borderRadius:9,padding:3,border:`1px solid ${C.border}`}}>
                {["month","week"].map(v => (
                  <button key={v} onClick={() => setView(v)} style={{padding:"6px 14px",borderRadius:7,border:"none",background:view===v?C.accent:"transparent",color:view===v?"#fff":C.textSub,fontWeight:700,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>
                    {v==="month"?"月表示":"週表示"}
                  </button>
                ))}
              </div>
              <div style={{position:"relative"}}>
                <input
                  value={staffSearch}
                  onChange={e => setStaffSearch(e.target.value)}
                  placeholder="スタッフ名で検索..."
                  style={{paddingLeft:28,paddingRight:staffSearch?24:8,paddingTop:7,paddingBottom:7,borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,color:C.text,fontSize:12,outline:"none",width:148,fontFamily:"inherit"}}
                />
                <span style={{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",color:C.textMute,pointerEvents:"none",lineHeight:0}}>
                  <Icons.Search size={13}/>
                </span>
                {staffSearch && (
                  <button onClick={() => setStaffSearch("")} style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:C.textMute,fontSize:14,lineHeight:1,padding:0,fontFamily:"inherit"}}>×</button>
                )}
              </div>
              <div style={{display:"flex",gap:3,background:C.surface2,borderRadius:9,padding:3,border:`1px solid ${C.border}`}}>
                {[["all","全員"],["正社員","正社員"],["パート","パート"]].map(([val,lbl]) => (
                  <button key={val} onClick={() => setStaffFilter(val)}
                    style={{padding:"6px 12px",borderRadius:7,border:"none",background:staffFilter===val?C.accent:"transparent",color:staffFilter===val?"#fff":C.textSub,fontWeight:700,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>
                    {lbl}
                  </button>
                ))}
              </div>
              <div style={{display:"flex",gap:3,background:C.surface2,borderRadius:9,padding:3,border:`1px solid ${C.border}`}}>
                {[["compact","密"],["standard","標準"],["wide","広"]].map(([val,lbl]) => (
                  <button key={val} onClick={() => setDensity(val)}
                    style={{padding:"6px 12px",borderRadius:7,border:"none",background:density===val?C.accent:"transparent",color:density===val?"#fff":C.textSub,fontWeight:700,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>
                    {lbl}
                  </button>
                ))}
              </div>
            </div>
          )}
          <div onClick={e => e.stopPropagation()}>
            {tab==="shift"       && view==="month" && <MonthView/>}
            {tab==="shift"       && view==="week"  && <WeekView/>}
            {tab==="personal"                       && <PersonalTab/>}
            {tab==="wish"                           && <WishTab/>}
            {tab==="alert"                          && <AlertTab/>}
            {tab==="constraints"                    && <ConstraintsTab/>}
            {tab==="employee"                       && <EmployeeTab/>}
            {tab==="required"                       && <RequiredTab/>}
          </div>
        </div>
      </div>
      {showCandidates && (
        <CandidatesModal
          candidates={candidates}
          onAdopt={adoptCandidate}
          onClose={() => setShowCandidates(false)}
          onRegenerate={n => runCandidateGeneration(n)}
        />
      )}
      {printModal && (
        <PrintSettingsModal
          title={printModal.type==="preview" ? "🖨 プレビュー印刷設定" : "📅 カレンダー印刷設定"}
          defaultSize="A4"
          defaultOrientation={printModal.type==="preview" ? "landscape" : "portrait"}
          onConfirm={(size, orient) => {
            const type = printModal.type;
            setPrintModal(null);
            type==="preview" ? exportPDF(size, orient) : exportCalendarPDF(size, orient);
          }}
          onClose={() => setPrintModal(null)}
        />
      )}
    </ShiftContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>

  <script>
    window.addEventListener('load', function () {
      try {
        const src = document.getElementById('app-src').textContent;
        const out = Babel.transform(src, { presets: ['react'] }).code;
        eval(out);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('root').style.display = 'block';
      } catch (e) {
        document.getElementById('loading').innerHTML =
          `<div style="color:#ef4444;padding:20px;font-size:13px">エラー: ${e.message}</div>`;
        console.error(e);
      }
    });
  </script>

</body>
</html>
