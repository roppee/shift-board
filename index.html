            {[
              ["最小勤務日数", "minWorkDays",    0, 31],
              ["最大勤務日数", "maxWorkDays",    0, 31],
              ["最小時間(h)",  "minWorkHours",   0, 400],
              ["最大時間(h)",  "maxWorkHours",   0, 400],
              ["最大連続日",   "maxConsecutive", 1, 14],
            ].map(([label, key, min, max]) => (
              <div key={key} className="field">
                <span className="lbl">{label}</span>
                <Stepper value={c[key]} onChange={v => upd(key, v)} min={min} max={max}/>
              </div>
            ))}
          </div>

          {/* 出勤不可曜日 */}
          <div className="rules-block">
            <span className="block-label">出勤不可の曜日</span>
            <div className="dow-row">
              {DOW.map((d, i) => {
                const on = c.unavailableDows.includes(i);
                return (
                  <button key={i}
                    className={`dow-pill${i===0?" sun":i===6?" sat":""}`}
                    aria-pressed={on}
                    onClick={() => {
                      const arr = on
                        ? c.unavailableDows.filter(x => x !== i)
                        : [...c.unavailableDows, i];
                      upd("unavailableDows", arr);
                    }}>
                    {d}
                  </button>
                );
              })}
            </div>
          </div>

          {/* 担当可能シフト */}
          <div className="rules-block">
            <span className="block-label">担当可能シフト</span>
            <div className="shift-toggle-row">
              {customShifts.map((s, idx) => {
                const on    = c.preferredShifts.includes(s.key);
                const color = BADGE_COLORS[idx % BADGE_COLORS.length];
                return (
                  <button key={s.key}
                    className={`shift-toggle${on ? " " + color : ""}`}
                    aria-pressed={on}
                    onClick={() => {
                      const arr = on
                        ? c.preferredShifts.filter(x => x !== s.key)
                        : [...c.preferredShifts, s.key];
                      upd("preferredShifts", arr);
                    }}>
                    {s.key}
                  </button>
                );
              })}
            </div>
          </div>

          {/* メモ */}
          <div className="field">
            <span className="lbl">メモ</span>
            <textarea className="txa"
              value={c.memo || ""}
              onChange={e => upd("memo", e.target.value)}
              placeholder="スタッフに関するメモ…"/>
          </div>
        </div>
      )}
    </div>
  );
}

// ── RequiredTab（必要人数） ───────────────────────────────
function RequiredTab() {
  const {
    customShifts, setCustomShifts, required, setRequired,
    orderConstraints, setOrderConstraints,
    fixedRules, setFixedRules, staffList, showMsg,
  } = useShift();

  const [editKey,     setEditKey]     = useState(null);
  const [editForm,    setEditForm]    = useState({ label:"", startH:9, endH:18 });
  const [showNewForm, setShowNewForm] = useState(false);
  const [newForm,     setNewForm]     = useState({ label:"", startH:9, endH:18 });
  const [fixForm,     setFixForm]     = useState({
    empId: staffList[0]?.id || null, dow:1, startH:9, endH:18,
  });

  function saveEdit() {
    if (!editForm.label.trim()) return;
    const newKey = editForm.label.trim();
    setCustomShifts(prev => prev.map(s =>
      s.key !== editKey ? s
        : { ...s, key:newKey, label:newKey, short:newKey.slice(0,1),
            startH:Number(editForm.startH), endH:Number(editForm.endH) }
    ));
    if (newKey !== editKey) {
      setRequired(prev => { const n={...prev}; n[newKey]=n[editKey]||0; delete n[editKey]; return n; });
      setOrderConstraints(prev => {
        const n={};
        Object.entries(prev).forEach(([k,v]) => {
          const nk = k===editKey ? newKey : k;
          n[nk] = v.map(x => x===editKey ? newKey : x);
        });
        return n;
      });
    }
    setEditKey(null);
  }

  function addShift() {
    if (!newForm.label.trim()) return;
    const key = newForm.label.trim();
    if (customShifts.some(s => s.key === key)) { alert("同じ名前のシフトが既に存在します"); return; }
    const pc = PILL_COLORS[customShifts.length % PILL_COLORS.length];
    setCustomShifts(prev => [...prev, { key, label:key, short:key.slice(0,1),
      startH:Number(newForm.startH), endH:Number(newForm.endH),
      color:pc.color, bg:pc.bg, text:pc.text }]);
    setRequired(prev => ({ ...prev, [key]:1 }));
    setNewForm({ label:"", startH:9, endH:18 });
    setShowNewForm(false);
  }

  function deleteShift(key) {
    if (!window.confirm(`「${key}」を削除しますか？`)) return;
    setCustomShifts(prev => prev.filter(s => s.key !== key));
    setRequired(prev => { const n={...prev}; delete n[key]; return n; });
    setOrderConstraints(prev => {
      const n={};
      Object.entries(prev).forEach(([k,v]) => { if (k!==key) n[k]=v.filter(x=>x!==key); });
      return n;
    });
  }

  function addFixedRule() {
    if (!fixForm.empId) return;
    const emp = staffList.find(e => e.id === fixForm.empId);
    const sh = fixForm.startH, eh = fixForm.endH;
    const timeStr  = `${fmt2(sh)}:00-${eh>24?`翌${fmt2(eh-24)}:00`:`${fmt2(eh)}:00`}`;
    const ruleName = `${emp?.name.split(" ")[0]}_${DOW[fixForm.dow]}_${timeStr}`;
    const matchShift = customShifts.find(s => s.startH===sh && s.endH===eh);
    const newRule = { id:Date.now(), ...fixForm, shiftKey:matchShift?.key||ruleName, displayName:ruleName };
    setFixedRules(prev => [...prev, newRule]);
    if (!customShifts.some(s=>s.key===ruleName) && !matchShift) {
      const pc = PILL_COLORS[customShifts.length % PILL_COLORS.length];
      setCustomShifts(prev => [...prev, { key:ruleName, label:ruleName, short:ruleName.slice(0,2),
        startH:sh, endH:eh, color:pc.color, bg:pc.bg, text:pc.text, isFixedRule:true }]);
      setRequired(prev => ({ ...prev, [ruleName]:1 }));
    }
    showMsg("✓ 固定ルールを追加しました");
  }

  const sortedShifts = [...customShifts].sort((a,b) => a.startH - b.startH);

  return (
    <div className="demand-page">
      <p className="demand-intro">勤務形態の追加・編集・削除と、必要人数・順序制約を設定します。</p>

      {/* シフト一覧 */}
      {sortedShifts.map((s, idx) => {
        const color   = BADGE_COLORS[customShifts.findIndex(x=>x.key===s.key) % BADGE_COLORS.length];
        const endLbl  = s.endH > 24 ? `翌${fmt2(s.endH-24)}:00` : `${fmt2(s.endH)}:00`;
        const isEdit  = editKey === s.key;
        return (
          <div key={s.key} className="shift-card" style={isEdit ? {border:"1.5px solid var(--accent)"} : {}}>
            {isEdit ? (
              /* 編集モード */
              <div style={{flex:1, display:"flex", flexWrap:"wrap", gap:14, alignItems:"flex-end"}}>
                <div className="field" style={{flex:1, minWidth:120}}>
                  <span className="lbl">名称</span>
                  <input className="inp" value={editForm.label}
                    onChange={e => setEditForm(f=>({...f, label:e.target.value}))}
                    style={{height:40}}/>
                </div>
                <TimePicker value={editForm.startH} onChange={v=>setEditForm(f=>({...f,startH:v}))} min={0} max={30} label="開始（時）"/>
                <TimePicker value={editForm.endH}   onChange={v=>setEditForm(f=>({...f,endH:v}))}   min={1} max={31} label="終了（時）"/>
                <div style={{display:"flex", gap:8}}>
                  <button className="btn btn-primary" style={{height:40}} onClick={saveEdit}>保存</button>
                  <button className="btn btn-outline" style={{height:40}} onClick={() => setEditKey(null)}>キャンセル</button>
                </div>
              </div>
            ) : (
              /* 通常モード */
              <>
                <div className="lhs">
                  <span className={`badge ${color}`} style={{flexShrink:0}}>{s.short}</span>
                  <div>
                    <div style={{fontWeight:600, fontSize:14}}>{s.key}
                      {s.isFixedRule && <span style={{marginLeft:6, fontSize:10, color:"var(--c-violet-ink)", background:"var(--c-violet-bg)", border:"1px solid var(--c-violet-line)", borderRadius:4, padding:"1px 5px"}}>固定</span>}
                    </div>
                    <div className="time" style={{fontSize:13, color:"var(--ink-3)", fontWeight:500}}>{fmt2(s.startH)}:00 〜 {endLbl}</div>
                  </div>
                </div>
                <div className="rhs">
                  <span className="req-l">必要人数</span>
                  <Stepper value={required[s.key]||0} onChange={v=>setRequired(p=>({...p,[s.key]:v}))}/>
                  <span className="demand-unit">名</span>
                  {!s.isFixedRule && <>
                    <button className="btn-mini" onClick={() => { setEditKey(s.key); setEditForm({label:s.label, startH:s.startH, endH:s.endH}); }}>編集</button>
                    <button className="btn-mini danger" onClick={() => deleteShift(s.key)}>削除</button>
                  </>}
                </div>
              </>
            )}
          </div>
        );
      })}

      <button className="add-shift-btn" onClick={() => { setShowNewForm(true); setNewForm({label:"",startH:9,endH:18}); }}>
        <Icons.Plus size={16}/> 新しい勤務形態を追加
      </button>

      {/* 新規シフト追加モーダル */}
      {showNewForm && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}
          onClick={() => setShowNewForm(false)}>
          <div style={{background:"var(--surface)",borderRadius:14,padding:24,width:"92%",maxWidth:380,boxShadow:"var(--shadow-lg)"}}
            onClick={e => e.stopPropagation()}>
            <div style={{fontWeight:700,fontSize:15,marginBottom:16}}>新しい勤務形態を追加</div>
            <div className="field" style={{marginBottom:14}}>
              <span className="lbl">名称</span>
              <input className="inp" value={newForm.label} autoFocus
                onChange={e => setNewForm(f=>({...f,label:e.target.value}))}
                placeholder="例：準夜勤"/>
            </div>
            <div style={{display:"flex",gap:20,flexWrap:"wrap",marginBottom:20}}>
              <TimePicker value={newForm.startH} onChange={v=>setNewForm(f=>({...f,startH:v}))} min={0} max={30} label="開始（時）"/>
              <TimePicker value={newForm.endH}   onChange={v=>setNewForm(f=>({...f,endH:v}))}   min={1} max={31} label="終了（時）"/>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button className="btn btn-outline" onClick={() => setShowNewForm(false)}>キャンセル</button>
              <button className="btn btn-primary" onClick={addShift}>追加</button>
            </div>
          </div>
        </div>
      )}

      {/* 固定ルールセクション */}
      <div className="demand-section">
        <h3><span className="pin" style={{width:22,height:22,display:"inline-grid",placeItems:"center",borderRadius:6,background:"var(--accent-soft)",color:"var(--accent)"}}>📌</span> 固定ルール</h3>
        <p className="section-desc">特定スタッフを特定の曜日に固定。自動生成時に最優先で適用されます。</p>
        <div className="fixrule-form">
          <div className="field">
            <span className="lbl">スタッフ</span>
            <select className="sel" value={fixForm.empId||""} onChange={e=>setFixForm(f=>({...f,empId:Number(e.target.value)}))}>
              {staffList.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
            </select>
          </div>
          <div className="field">
            <span className="lbl">曜日</span>
            <select className="sel" value={fixForm.dow} onChange={e=>setFixForm(f=>({...f,dow:Number(e.target.value)}))}>
              {DOW.map((d,i) => <option key={i} value={i}>{d}曜日</option>)}
            </select>
          </div>
          <TimePicker value={fixForm.startH} onChange={v=>setFixForm(f=>({...f,startH:v}))} min={0} max={30} label="開始（時）"/>
          <TimePicker value={fixForm.endH}   onChange={v=>setFixForm(f=>({...f,endH:v}))}   min={1} max={31} label="終了（時）"/>
          <button className="btn btn-primary" style={{alignSelf:"flex-end",height:44}} onClick={addFixedRule}>追加</button>
        </div>
        {fixedRules.length === 0 ? (
          <div className="empty-state">
            <div style={{fontSize:20}}>📌</div>
            <div>固定ルールがまだありません</div>
          </div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {fixedRules.map(rule => {
              const emp = staffList.find(e => e.id === rule.empId);
              if (!emp) return null;
              const sh = rule.startH??0, eh = rule.endH??0;
              const timeStr = `${fmt2(sh)}:00〜${eh>24?`翌${fmt2(eh-24)}:00`:`${fmt2(eh)}:00`}`;
              return (
                <div key={rule.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"var(--surface-2)",borderRadius:10,border:"1px solid var(--line)",flexWrap:"wrap"}}>
                  <span style={{width:8,height:8,borderRadius:"50%",background:emp.color,flexShrink:0}}/>
                  <span style={{fontWeight:600,fontSize:13,flex:1}}>{emp.name}</span>
                  <span style={{fontSize:12,color:"var(--ink-3)",background:"var(--surface)",borderRadius:6,padding:"2px 8px",border:"1px solid var(--line)"}}>{DOW[rule.dow]}曜日</span>
                  <span style={{fontSize:12,fontWeight:600,color:"var(--accent)",background:"var(--accent-soft)",borderRadius:6,padding:"2px 8px"}}>{timeStr}</span>
                  <button className="btn-mini danger" onClick={() => {
                    setFixedRules(prev => prev.filter(r => r.id!==rule.id));
                    if (rule.displayName) setCustomShifts(prev => prev.filter(s => s.key!==rule.displayName));
                  }}>削除</button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* 順序制約セクション */}
      <div className="demand-section">
        <h3>順序制約</h3>
        <p className="section-desc">前日のシフトの翌日に入れないシフトを指定します（✕ = 禁止）。</p>
        <div style={{overflowX:"auto"}}>
          <table className="seq-table">
            <thead>
              <tr>
                <th style={{textAlign:"left",padding:"6px 14px 10px 4px",fontSize:11,color:"var(--ink-3)"}}>前日↓ 翌日→</th>
                {customShifts.map(s => (
                  <th key={s.key}><span className={`badge ${getShiftColor(s.key, customShifts)}`} style={{height:24,fontSize:11}}>{s.short}</span></th>
                ))}
              </tr>
            </thead>
            <tbody>
              {customShifts.map(from => (
                <tr key={from.key}>
                  <th><span className={`badge ${getShiftColor(from.key, customShifts)}`} style={{height:24,fontSize:11}}>{from.short}</span></th>
                  {customShifts.map(to => {
                    const isSelf = from.key === to.key;
                    const isOn   = (orderConstraints[from.key]||[]).includes(to.key);
                    return (
                      <td key={to.key}>
                        {isSelf ? (
                          <button className="seq-cell diag" disabled>—</button>
                        ) : (
                          <button className={`seq-cell${isOn?" on":""}`}
                            onClick={() => setOrderConstraints(prev => {
                              const cur = prev[from.key]||[];
                              return {...prev, [from.key]: isOn ? cur.filter(x=>x!==to.key) : [...cur, to.key]};
                            })}>
                            {isOn ? "✕" : ""}
                          </button>
                        )}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p className="seq-legend">✕ = 前日にそのシフトがある場合、翌日には入れない</p>
      </div>
    </div>
  );
}

// ── EmployeeTab（従業員管理） ─────────────────────────────
function EmployeeTab() {
  const { staffList, setStaffList, stats, showMsg } = useShift();
  const [newName,   setNewName]   = useState("");
  const [newRole,   setNewRole]   = useState("正社員");
  const [newGender, setNewGender] = useState("female");
  const [editId,    setEditId]    = useState(null);
  const [editName,  setEditName]  = useState("");
  const [editRole,  setEditRole]  = useState("正社員");
  const [editGender,setEditGender]= useState("female");

  function addStaff() {
    if (!newName.trim()) return;
    const id = Date.now();
    setStaffList(prev => [...prev, { id, name:newName.trim(), role:newRole, gender:newGender, color:COLORS[prev.length%COLORS.length] }]);
    setNewName("");
    showMsg("✓ 追加しました");
  }

  function saveEdit() {
    if (!editName.trim()) return;
    setStaffList(prev => prev.map(e =>
      e.id === editId ? { ...e, name:editName.trim(), role:editRole, gender:editGender } : e
    ));
    setEditId(null);
    showMsg("✓ 更新しました");
  }

  return (
    <div className="staff-page">
      {/* 追加フォーム */}
      <div className="staff-add-form">
        <div className="field">
          <span className="lbl">氏名</span>
          <input className="inp" value={newName} placeholder="新しい従業員名"
            onChange={e => setNewName(e.target.value)}
            onKeyDown={e => e.key==="Enter" && addStaff()}/>
        </div>
        <div className="field">
          <span className="lbl">役職</span>
          <select className="sel" value={newRole} onChange={e => setNewRole(e.target.value)}>
            <option value="正社員">正社員</option>
            <option value="パート">パート</option>
          </select>
        </div>
        <div className="field">
          <span className="lbl">性別</span>
          <select className="sel" value={newGender} onChange={e => setNewGender(e.target.value)}>
            <option value="female">女性</option>
            <option value="male">男性</option>
          </select>
        </div>
        <button className="btn btn-primary" onClick={addStaff}>
          <Icons.Plus size={16}/> 追加
        </button>
      </div>

      {/* スタッフ一覧 */}
      <div className="staff-list">
        {staffList.map(emp => {
          const st      = stats.find(s => s.id === emp.id);
          const isEdit  = editId === emp.id;
          const daysOk  = st?.daysOk;
          const hoursOk = st?.hoursOk;
          return (
            <div key={emp.id} className="staff-row"
              style={isEdit ? {border:"1.5px solid var(--accent)"} : {}}>
              {isEdit ? (
                /* 編集モード */
                <>
                  <div className="name-dot" style={{background:emp.color}}/>
                  <input className="inp" value={editName} autoFocus
                    onChange={e => setEditName(e.target.value)}
                    style={{flex:1, minWidth:0, height:40}}/>
                  <select className="sel" value={editRole} onChange={e => setEditRole(e.target.value)} style={{width:120}}>
                    <option value="正社員">正社員</option>
                    <option value="パート">パート</option>
                  </select>
                  <select className="sel" value={editGender} onChange={e => setEditGender(e.target.value)} style={{width:100}}>
                    <option value="female">女性</option>
                    <option value="male">男性</option>
                  </select>
                  <button className="btn btn-primary" style={{height:40}} onClick={saveEdit}>保存</button>
                  <button className="btn btn-outline" style={{height:40}} onClick={() => setEditId(null)}>キャンセル</button>
                </>
              ) : (
                /* 通常モード */
                <>
                  <div className="nm-block">
                    <div className="nm">
                      <span className="dot" style={{background:emp.color}}/>
                      {emp.name}
                    </div>
                    <div className="stats">
                      <span className="s">勤務 <span className={`v${daysOk?" green":""}`}>{st?.workDays??0}日</span></span>
                      <span className="s">時間 <span className={`v${hoursOk?" green":""}`}>{st?.workHours??0}h</span></span>
                      <span className="s">希望休 <span className="v rose">{st?.wishOff??0}件</span></span>
                    </div>
                  </div>
                  <div className="spacer"/>
                  <div className="tags">
                    <span className={`tag${emp.role==="正社員"?" role-ft":" role-pt"}`}>{emp.role}</span>
                    <span className={`tag${emp.gender==="female"?" g-f":" g-m"}`}>{emp.gender==="female"?"女性":"男性"}</span>
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button className="btn-mini" onClick={() => { setEditId(emp.id); setEditName(emp.name); setEditRole(emp.role||"正社員"); setEditGender(emp.gender||"female"); }}>編集</button>
                    <button className="btn-mini danger" onClick={() => setStaffList(prev => prev.filter(e => e.id!==emp.id))}>削除</button>
                  </div>
                </>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── CandidatesModal ───────────────────────────────────────

          <div style={{textAlign:"center",padding:40,color:C.textMute,background:C.surface2,borderRadius:10}}>候補がありません</div>

          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {candidates.map((cand, i) => {
              const isTop  = i === 0;
              const total  = cand.alerts.total;
              const aColor = total===0?C.green:total<5?C.amber:C.red;
              const aBg    = total===0?C.greenBg:total<5?C.amberBg:C.redBg;
              const shiftSummary = customShifts.map(s => {
                let shortage=0, days_short=0;
                for (let d=1;d<=cand.daysInMonth;d++) {
                  const needed=cand.requiredMap[s.key]||0;
                  const actual=cand.staffList.filter(e=>cand.shifts[e.id]?.[d]===s.key).length;
                  if (actual<needed) { shortage+=needed-actual; days_short++; }
                }
                return { key:s.key, shortage, days_short };
              }).filter(x => x.shortage > 0);
              return (
                <div key={i} style={{borderRadius:12,border:isTop?`2px solid ${C.green}`:`1px solid ${C.border}`,padding:"14px 16px",background:isTop?`${C.green}0a`:C.surface,position:"relative"}}>
                  {isTop && <div style={{position:"absolute",top:-10,left:16,background:C.green,color:"#fff",fontSize:9,fontWeight:800,borderRadius:5,padding:"2px 9px",letterSpacing:"0.04em"}}>BEST</div>}
                  <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                    <div style={{fontWeight:800,fontSize:20,color:isTop?C.green:C.textMute,minWidth:32}}>#{i+1}</div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:shiftSummary.length?6:0,flexWrap:"wrap"}}>
                        <span style={{padding:"4px 12px",borderRadius:8,fontSize:12,fontWeight:700,background:aBg,color:aColor,border:`1px solid ${aColor}33`}}>
                          {total===0?"✓ アラートなし":`⚠ ${total}件`}
                        </span>
                        {total>0 && <>
                          <span style={{fontSize:11,color:C.textSub}}>人員不足 {cand.alerts.staffingCount}件</span>
                          <span style={{fontSize:11,color:C.textSub}}>制約違反 {cand.alerts.constraintCount}件</span>
                        </>}
                      </div>
                      {shiftSummary.length>0 && (
                        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                          {shiftSummary.map(x => {
                            const t=SHIFT_TYPES[x.key];
                            return <span key={x.key} style={{fontSize:10,padding:"1px 7px",borderRadius:5,background:t?.bg||C.surface2,color:t?.text||C.textSub,border:`1px solid ${t?.color||C.border}55`}}>{x.key}: {x.days_short}日不足</span>;
                          })}
                        </div>
                      )}
                    </div>
                    <button onClick={() => { onAdopt(cand); onClose(); }}
                      style={S.btn(isTop?C.green:C.accent)}>採用</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────
function App() {
  const today = new Date();

  // ── localStorage ロード ───────────────────────────────
  const saved = (() => {
    try { return JSON.parse(localStorage.getItem("shift_app_v1") || "{}"); }
    catch(e) { return {}; }
  })();
  const toSetMap = obj =>
    Object.fromEntries(Object.entries(obj).map(([k,v]) => [k, new Set(v)]));

  // ── State ─────────────────────────────────────────────
  const [currentDate,      setCurrentDate]      = useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const [view,             setView]             = useState("month");
  const [tab,              setTab]              = useState("shift");
  const [density,          setDensity]          = useState("default");
  const [staffList,        setStaffList]        = useState(saved.staffList        || INITIAL_STAFF);
  const [staffShifts,      setStaffShifts]      = useState(saved.staffShifts      || {});
  const [wishdays,         setWishdays]         = useState(() => toSetMap(saved.wishdays     || {}));
  const [constraints,      setConstraints]      = useState(saved.constraints      || {});
  const [required,         setRequired]         = useState(saved.required         || DEFAULT_REQUIRED);
  const [customShifts,     setCustomShifts]     = useState(saved.customShifts     || INITIAL_SHIFTS);
  const [orderConstraints, setOrderConstraints] = useState(saved.orderConstraints || ORDER_CONSTRAINTS_DEFAULT);
  const [lockedCells,      setLockedCells]      = useState(() => toSetMap(saved.lockedCells  || {}));
  const [savedMonths,      setSavedMonths]      = useState(saved.savedMonths      || {});
  const [fixedRules,       setFixedRules]       = useState(saved.fixedRules       || []);
  const [editCell,         setEditCell]         = useState(null); // { empId, day, x, y }
  const [msg,              setMsg]              = useState("");
  const [msgVisible,       setMsgVisible]       = useState(false);
  const [candidates,       setCandidates]       = useState([]);
  const [showCandidates,   setShowCandidates]   = useState(false);

  // ── テーマ適用 ────────────────────────────────────────
  useEffect(() => {
    document.documentElement.setAttribute("data-theme",   "slate");
    document.documentElement.setAttribute("data-density", density);
    document.documentElement.setAttribute("data-badge",   "soft");
  }, [density]);

  // ── 派生値 ───────────────────────────────────────────
  const year        = currentDate.getFullYear();
  const month       = currentDate.getMonth();
  const daysInMonth = getDaysInMonth(year, month);
  const weekDates   = getWeekDates(currentDate);

  const SHIFT_TYPES = useMemo(() => {
    const obj = {};
    customShifts.forEach(s => {
      const endLabel = s.endH > 24 ? `翌${fmt2(s.endH-24)}:00` : `${fmt2(s.endH)}:00`;
      obj[s.key] = { label:s.label, short:s.short, hours:`${fmt2(s.startH)}:00-${endLabel}`, color:s.color, bg:s.bg, text:s.text };
    });
    return { ...obj, ...FIXED_TYPES };
  }, [customShifts]);

  const SHIFT_HOURS = useMemo(() => {
    const obj = { 休み:0, 希望休:0 };
    customShifts.forEach(s => { obj[s.key] = s.endH - s.startH; });
    return obj;
  }, [customShifts]);

  // ── localStorage 保存 ─────────────────────────────────
  useEffect(() => {
    try {
      const data = {
        staffList, staffShifts, constraints, required,
        customShifts, orderConstraints, savedMonths, fixedRules,
        wishdays:    Object.fromEntries(Object.entries(wishdays).map(([k,v])    => [k,[...v]])),
        lockedCells: Object.fromEntries(Object.entries(lockedCells).map(([k,v]) => [k,[...v]])),
      };
      localStorage.setItem("shift_app_v1", JSON.stringify(data));
    } catch(e) {}
  }, [staffList, staffShifts, wishdays, constraints, required,
      customShifts, orderConstraints, lockedCells, savedMonths, fixedRules]);

  // ── Stats ────────────────────────────────────────────
  const stats = useMemo(() => staffList.map(emp => {
    const shifts    = staffShifts[emp.id] || {};
    const isWork    = v => !["休み","希望休"].includes(v);
    const workDays  = Object.values(shifts).filter(isWork).length;
    const workHours = Object.values(shifts).reduce((a,v) => a+(SHIFT_HOURS[v]||0), 0);
    const wishOff   = Object.values(shifts).filter(v => v==="希望休").length;
    const c         = constraints[emp.id] || DEFAULT_CONSTRAINTS;
    return { ...emp, workDays, workHours, wishOff,
      daysOk:  workDays  >= c.minWorkDays  && workDays  <= c.maxWorkDays,
      hoursOk: workHours >= c.minWorkHours && workHours <= c.maxWorkHours,
      minWorkDays:c.minWorkDays, maxWorkDays:c.maxWorkDays,
      minWorkHours:c.minWorkHours, maxWorkHours:c.maxWorkHours,
    };
  }), [staffList, staffShifts, constraints, SHIFT_HOURS]);

  // ── アラート ─────────────────────────────────────────
  const staffingAlerts = useMemo(() => {
    const alerts = [];
    for (let d=1; d<=daysInMonth; d++) {
      const dow = getDow(year,month,d);
      customShifts.forEach(s => {
        const needed = required[s.key]||0; if (!needed) return;
        const actual = staffList.filter(emp => staffShifts[emp.id]?.[d]===s.key).length;
        if (actual < needed) alerts.push({ d, dow, shiftKey:s.key, needed, actual, shortage:needed-actual });
      });
    }
    return alerts;
  }, [staffShifts, required, customShifts, staffList, year, month, daysInMonth]);

  const constraintAlerts = useMemo(() => {
    const alerts = [];
    staffList.forEach(emp => {
      const shifts    = staffShifts[emp.id] || {};
      const c         = constraints[emp.id] || DEFAULT_CONSTRAINTS;
      const isWork    = v => !["休み","希望休"].includes(v);
      const workDays  = Object.values(shifts).filter(isWork).length;
      const workHours = Object.values(shifts).reduce((a,v) => a+(SHIFT_HOURS[v]||0), 0);
      const reasons   = [];
      if (workDays  < c.minWorkDays)  reasons.push(`勤務日数不足 (${workDays}/${c.minWorkDays}日)`);
      if (workDays  > c.maxWorkDays)  reasons.push(`勤務日数超過 (${workDays}/${c.maxWorkDays}日)`);
      if (workHours < c.minWorkHours) reasons.push(`勤務時間不足 (${workHours}h/${c.minWorkHours}h)`);
      if (workHours > c.maxWorkHours) reasons.push(`勤務時間超過 (${workHours}h/${c.maxWorkHours}h)`);
      let maxConsec=0, cur=0;
      for (let d=1; d<=daysInMonth; d++) {
        if (isWork(shifts[d]||"休み")) { cur++; maxConsec=Math.max(maxConsec,cur); } else cur=0;
      }
      if (maxConsec > c.maxConsecutive) reasons.push(`連続勤務超過 (${maxConsec}連勤/${c.maxConsecutive}日上限)`);
      for (let d=2; d<=daysInMonth; d++) {
        const p=shifts[d-1], q=shifts[d];
        if (p&&q&&(orderConstraints[p]||[]).includes(q)) reasons.push(`順序違反: ${d-1}日${p}→${d}日${q}`);
      }
      if (reasons.length) alerts.push({ emp, workDays, workHours, reasons });
    });
    return alerts;
  }, [staffList, staffShifts, constraints, SHIFT_HOURS, year, month, daysInMonth, orderConstraints]);

  const totalAlerts = staffingAlerts.length + constraintAlerts.length;

  // ── 前月末尾 ──────────────────────────────────────────
  const prevMonthTail = useMemo(() => {
    const prevYear  = month===0 ? year-1 : year;
    const prevMonth = month===0 ? 12 : month;
    const key       = `${prevYear}-${prevMonth}`;
    const saved2    = savedMonths[key];
    if (!saved2) return null;
    const maxC    = staffList.reduce((a,emp) => Math.max(a,(constraints[emp.id]||DEFAULT_CONSTRAINTS).maxConsecutive), DEFAULT_CONSTRAINTS.maxConsecutive);
    const tailCnt = Math.max(1, maxC - 1);
    const prevDays = getDaysInMonth(prevYear, prevMonth-1);
    const tail = {};
    staffList.forEach(emp => {
      tail[emp.id] = {};
      for (let i=0; i<tailCnt; i++) {
        const d = prevDays - i;
        if (d>=1) tail[emp.id][d] = saved2[emp.id]?.[d] || "休み";
      }
    });
    return { shifts:tail, totalDays:prevDays, tailCount:tailCnt };
  }, [savedMonths, year, month, staffList, constraints]);

  // ── アクション ───────────────────────────────────────
  const showMsg = message => {
    setMsg(message); setMsgVisible(true);
    setTimeout(() => setMsgVisible(false), 2800);
  };

  function openEdit(e, empId, day) {
    e.stopPropagation();
    if (editCell?.empId===empId && editCell?.day===day) { setEditCell(null); return; }
    const rect = e.currentTarget.getBoundingClientRect();
    const x    = Math.min(rect.left, window.innerWidth  - 295);
    const y    = rect.bottom + 6 + 330 < window.innerHeight
               ? rect.bottom + 6
               : Math.max(8, rect.top - 336);
    setEditCell({ empId, day, x, y });
  }

  function toggleCellLock(empId, day) {
    setLockedCells(prev => {
      const next = new Set(prev[empId]||[]);
      next.has(day) ? next.delete(day) : next.add(day);
      return { ...prev, [empId]:next };
    });
  }

  function toggleAllLock(empId) {
    setLockedCells(prev => {
      const allDays   = Array.from({length:daysInMonth},(_,i)=>i+1);
      const current   = prev[empId] || new Set();
      const allLocked = allDays.every(d => current.has(d));
      return { ...prev, [empId]: allLocked ? new Set() : new Set(allDays) };
    });
  }

  function setCellShift(empId, day, type) {
    setStaffShifts(prev => ({ ...prev, [empId]:{ ...(prev[empId]||{}), [day]:type } }));
    setEditCell(null);
  }

  function toggleWish(empId, key) {
    setWishdays(prev => {
      const next = new Set(prev[empId]||[]);
      next.has(key) ? next.delete(key) : next.add(key);
      return { ...prev, [empId]:next };
    });
  }

  function runAutoGenerate() {
    const lockedInitial = {};
    staffList.forEach(emp => {
      const locked = lockedCells[emp.id]||new Set();
      lockedInitial[emp.id] = {};
      locked.forEach(d => { const cur=staffShifts[emp.id]?.[d]; if(cur) lockedInitial[emp.id][d]=cur; });
    });
    const gen = autoGenerate(staffList,year,month,wishdays,constraints,required,SHIFT_HOURS,customShifts,orderConstraints,lockedInitial,prevMonthTail,fixedRules);
    setStaffShifts(prev => { const next={...prev}; staffList.forEach(emp => { next[emp.id]=gen[emp.id]||{}; }); return next; });
    showMsg("✓ シフトを自動生成しました");
  }

  function runCandidateGeneration(n=5) {
    const lockedInitial = {};
    staffList.forEach(emp => {
      const locked = lockedCells[emp.id]||new Set();
      lockedInitial[emp.id] = {};
      locked.forEach(d => { const cur=staffShifts[emp.id]?.[d]; if(cur) lockedInitial[emp.id][d]=cur; });
    });
    const results = [];
    for (let i=0; i<n; i++) {
      const gen    = autoGenerate(staffList,year,month,wishdays,constraints,required,SHIFT_HOURS,customShifts,orderConstraints,lockedInitial,prevMonthTail,fixedRules);
      const alerts = computeAlertsForShifts(gen,staffList,customShifts,required,constraints,SHIFT_HOURS,orderConstraints,year,month,daysInMonth);
      results.push({ shifts:gen, alerts, daysInMonth, staffList, requiredMap:required });
    }
    results.sort((a,b) => a.alerts.total - b.alerts.total);
    const seen=new Set();
    const unique=results.filter(r => {
      const fp=staffList.slice(0,4).map(e=>Array.from({length:Math.min(7,daysInMonth)},(_,d)=>r.shifts[e.id]?.[d+1]||"").join(",")).join("|");
      if(seen.has(fp)) return false; seen.add(fp); return true;
    });
    setCandidates(unique); setShowCandidates(true);
    showMsg(`✓ ${unique.length}件の候補を生成しました`);
  }

  function adoptCandidate(cand) {
    setStaffShifts(prev => { const next={...prev}; staffList.forEach(emp => { next[emp.id]=cand.shifts[emp.id]||{}; }); return next; });
    showMsg("✓ 候補を採用しました");
  }

  function confirmAndNextMonth() {
    if (!window.confirm(`${year}年${month+1}月のシフトを確定して翌月へ進みますか？`)) return;
    const key = `${year}-${month+1}`;
    setSavedMonths(prev => ({ ...prev, [key]:staffShifts }));
    setCurrentDate(new Date(year, month+1, 1));
    showMsg(`✓ ${year}年${month+1}月を確定しました`);
  }

  function exportData() {
    const data = {
      staffList, staffShifts, constraints, required, customShifts, orderConstraints, savedMonths, fixedRules,
      wishdays:    Object.fromEntries(Object.entries(wishdays).map(([k,v])    => [k,[...v]])),
      lockedCells: Object.fromEntries(Object.entries(lockedCells).map(([k,v]) => [k,[...v]])),
    };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
    const a    = document.createElement("a");
    a.href     = URL.createObjectURL(blob);
    a.download = `shift_backup_${year}${fmt2(month+1)}.json`;
    a.click();
    showMsg("✓ エクスポートしました");
  }

  function importData() {
    const input   = document.createElement("input");
    input.type    = "file"; input.accept = ".json";
    input.onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          if (d.staffList)        setStaffList(d.staffList);
          if (d.staffShifts)      setStaffShifts(d.staffShifts);
          if (d.constraints)      setConstraints(d.constraints);
          if (d.required)         setRequired(d.required);
          if (d.customShifts)     setCustomShifts(d.customShifts);
          if (d.orderConstraints) setOrderConstraints(d.orderConstraints);
          if (d.savedMonths)      setSavedMonths(d.savedMonths);
          if (d.fixedRules)       setFixedRules(d.fixedRules);
          if (d.wishdays)         setWishdays(toSetMap(d.wishdays));
          if (d.lockedCells)      setLockedCells(toSetMap(d.lockedCells));
          showMsg("✓ インポートしました");
        } catch { alert("読み込みに失敗しました"); }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function exportPDF() {
    const days  = Array.from({length:daysInMonth},(_,i)=>i+1);
    const title = `勤務表　${year}年${month+1}月`;
    const pillHtml = type => {
      const t = SHIFT_TYPES[type]||FIXED_TYPES["休み"];
      return `<span style="display:inline-block;width:18px;height:18px;line-height:18px;border-radius:3px;font-size:9px;font-weight:700;background:${t.bg};color:${t.text};border:1px solid ${t.color}88;text-align:center;">${t.short}</span>`;
    };
    const chunkSize = 13;
    const pages = [];
    for (let i=0; i<staffList.length; i+=chunkSize) pages.push(staffList.slice(i,i+chunkSize));
    const makeTable = (chunk,pi) => {
      const headerCols = days.map(d => {
        const dow=getDow(year,month,d);
        const color=dow===0?"#ef4444":dow===6?"#3b82f6":"#475569";
        return `<td class="dc" style="color:${color};background:#f8fafc;font-weight:700;font-size:9px;text-align:center;padding:2px 0;">${d}<br/><span style="font-size:7px">${DOW[dow]}</span></td>`;
      }).join("");
      const rows = chunk.map((emp,ei) => {
        const bg=ei%2===0?"#fff":"#f8fafc";
        const cells=days.map(d=>{const type=staffShifts[emp.id]?.[d]||"休み";return `<td class="dc" style="padding:1px 0;text-align:center;background:${bg};">${pillHtml(type)}</td>`;}).join("");
        const wd=days.filter(d=>!["休み","希望休"].includes(staffShifts[emp.id]?.[d]||"休み")).length;
        const wh=days.reduce((a,d)=>a+(SHIFT_HOURS[staffShifts[emp.id]?.[d]]||0),0);
        return `<tr><td class="nc" style="background:${bg};padding:2px 5px;white-space:nowrap;"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${emp.color};margin-right:3px;vertical-align:middle;"></span><span style="font-size:11px;font-weight:700;">${emp.name}</span></td>${cells}<td class="wc" style="background:${bg};text-align:center;font-size:11px;font-weight:700;color:#0369a1;">${wd}日</td><td class="hc" style="background:${bg};text-align:center;font-size:11px;font-weight:700;color:#059669;">${wh}h</td></tr>`;
      }).join("");
      return `${pi>0?'<div class="pb"></div>':''}<div class="page"><div class="ttl">${title}　<span class="sub">出力日: ${today.getFullYear()}/${today.getMonth()+1}/${today.getDate()}${pages.length>1?` (${pi+1}/${pages.length})`:""}</span></div><table><thead><tr><td class="nc" style="background:#f1f5f9;font-size:10px;font-weight:700;">氏名</td>${headerCols}<td class="wc" style="background:#f1f5f9;font-size:9px;font-weight:700;text-align:center;">勤務</td><td class="hc" style="background:#f1f5f9;font-size:9px;font-weight:700;text-align:center;">時間</td></tr></thead><tbody>${rows}</tbody></table></div>`;
    };
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>${title}</title><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#fff;padding:10px;}.ttl{font-size:13px;font-weight:900;color:#1e293b;margin-bottom:3px;}.sub{font-size:9px;color:#94a3b8;font-weight:400;}table{border-collapse:collapse;width:100%;table-layout:fixed;}td{border:1px solid #e2e8f0;}.nc{width:88px;}.dc{width:calc((100% - 88px - 30px - 36px) / ${days.length});}.wc{width:30px;}.hc{width:36px;}tr{page-break-inside:avoid;}.page{width:100%;}.pb{page-break-before:always;height:0;}.btn-row{display:flex;gap:8px;margin-bottom:12px;}.print-btn{padding:7px 18px;background:#e11d48;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;}.back-btn{padding:7px 18px;background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;}@media print{.btn-row{display:none;}@page{size:A4 landscape;margin:5mm 4mm;}body{padding:0;}}</style></head><body><div class="btn-row"><button class="back-btn" onclick="window.close()">← 閉じる</button><button class="print-btn" onclick="window.print()">🖨 印刷 / PDFで保存</button></div>${pages.map((c,i)=>makeTable(c,i)).join("")}</body></html>`;
    const w = window.open("","_blank");
    if (w) { w.document.write(html); w.document.close(); }
    showMsg("🖨 プレビューを開きました");
  }

  function exportCalendarPDF() {
    const days     = Array.from({length:daysInMonth},(_,i)=>i+1);
    const title    = `${year}年${month+1}月　個人カレンダー`;
    const firstDow = getDow(year,month,1);
    const shiftPill = type => {
      const t=SHIFT_TYPES[type]||FIXED_TYPES["休み"];
      if (["休み"].includes(type)) return "";
      return `<div style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:${t.bg};color:${t.text};border:1px solid ${t.color}66;margin-top:3px;">${t.label}</div>`;
    };
    const pageHtmls = staffList.map((emp,ei) => {
      const s=staffShifts[emp.id]||{};
      const wd=days.filter(d=>!["休み","希望休"].includes(s[d]||"休み")).length;
      const wh=days.reduce((a,d)=>a+(SHIFT_HOURS[s[d]]||0),0);
      const calCells=[];
      for(let i=0;i<firstDow;i++) calCells.push(`<td style="border:1px solid #e2e8f0;background:#fafafa;"></td>`);
      days.forEach(d=>{const dow=getDow(year,month,d);const type=s[d]||"休み";const t=SHIFT_TYPES[type]||FIXED_TYPES["休み"];const isOff=["休み","希望休"].includes(type);const dayColor=dow===0?"#ef4444":dow===6?"#3b82f6":"#1e293b";const bg=isOff?"#f8fafc":t.bg;calCells.push(`<td style="border:1px solid #e2e8f0;background:${bg};padding:4px;vertical-align:top;width:14.28%;height:52px;"><div style="font-size:13px;font-weight:700;color:${dayColor};">${d}</div>${shiftPill(type)}</td>`);});
      const total=firstDow+daysInMonth;const remainder=total%7===0?0:7-(total%7);for(let i=0;i<remainder;i++) calCells.push(`<td style="border:1px solid #e2e8f0;background:#fafafa;"></td>`);
      const rows=[];for(let i=0;i<calCells.length;i+=7) rows.push(`<tr>${calCells.slice(i,i+7).join("")}</tr>`);
      return `${ei>0?'<div style="page-break-before:always;"></div>':''}<div style="padding:12px 14px;"><div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid #e2e8f0;"><div style="width:36px;height:36px;border-radius:50%;background:${emp.color};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;">${emp.name.charAt(0)}</div><div style="font-size:18px;font-weight:900;color:#1e293b;">${emp.name}</div><div style="font-size:14px;color:#64748b;margin-left:8px;">${year}年${month+1}月 — ${wd}日 / ${wh}h</div></div><table style="width:100%;border-collapse:collapse;table-layout:fixed;"><thead><tr>${["日","月","火","水","木","金","土"].map((d,i)=>`<th style="text-align:center;padding:4px 0;font-size:11px;font-weight:700;color:${i===0?"#ef4444":i===6?"#3b82f6":"#475569"};border-bottom:2px solid #e2e8f0;">${d}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
    }).join("");
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"/><title>${title}</title><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#fff;}.btn-row{display:flex;gap:8px;padding:12px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;}.print-btn{padding:8px 20px;background:#e11d48;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}.back-btn{padding:8px 20px;background:#fff;color:#475569;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}@media print{.btn-row{display:none;}@page{size:A4 portrait;margin:6mm;}body{padding:0;}}</style></head><body><div class="btn-row"><button class="back-btn" onclick="window.close()">← 閉じる</button><button class="print-btn" onclick="window.print()">🖨 印刷 / PDFで保存</button><span style="font-size:12px;color:#64748b;align-self:center;">${title}　全${staffList.length}名</span></div>${pageHtmls}</body></html>`;
    const w=window.open("","_blank");
    if(w){w.document.write(html);w.document.close();}
    showMsg("📅 カレンダーPDFを開きました");
  }

  // ── タブ定義 ─────────────────────────────────────────
  const TABS = [
    { key:"shift",       label:"勤務表"    },
    { key:"personal",    label:"個人ビュー" },
    { key:"wish",        label:"希望休"    },
    { key:"alert",       label:"アラート"  },
    { key:"constraints", label:"個人制約"  },
    { key:"required",    label:"必要人数"  },
    { key:"employee",    label:"従業員管理" },
  ];

  // ── ヘッダーラベル ────────────────────────────────────
  const headerLabel = view === "month"
    ? `${year}年 ${month + 1}月`
    : `${weekDates[0].getMonth()+1}/${weekDates[0].getDate()} 〜 ${weekDates[6].getMonth()+1}/${weekDates[6].getDate()}`;

  // ── Context値 ─────────────────────────────────────────
  const contextValue = {
    staffList, setStaffList,
    staffShifts, setStaffShifts,
    wishdays, setWishdays,
    constraints, setConstraints,
    required, setRequired,
    customShifts, setCustomShifts,
    orderConstraints, setOrderConstraints,
    lockedCells, setLockedCells,
    fixedRules, setFixedRules,
    savedMonths, setSavedMonths,
    year, month, daysInMonth, weekDates, today,
    SHIFT_TYPES, SHIFT_HOURS,
    stats, staffingAlerts, constraintAlerts, totalAlerts,
    prevMonthTail, editCell,
    showMsg, openEdit,
    toggleCellLock, toggleAllLock, setCellShift, toggleWish,
  };

  // ── 月/週切替ハンドラー ──────────────────────────────
  function prevPeriod() {
    if (view === "week") {
      const nd = new Date(currentDate); nd.setDate(nd.getDate()-7); setCurrentDate(nd);
    } else {
      setCurrentDate(new Date(year, month-1, 1));
    }
  }
  function nextPeriod() {
    if (view === "week") {
      const nd = new Date(currentDate); nd.setDate(nd.getDate()+7); setCurrentDate(nd);
    } else {
      setCurrentDate(new Date(year, month+1, 1));
    }
  }

  return (
    <ShiftContext.Provider value={contextValue}>
      <div className="app" onClick={() => editCell && setEditCell(null)}>

        {/* ── トップバー ── */}
        <div className="topbar">
          <div className="brand">
            <div className="brand-mark">勤</div>
            <div>
              <div className="brand-title">勤務表</div>
            </div>
          </div>
          <div className="topbar-actions">
            <button className="btn btn-ghost" onClick={exportPDF}>
              <Icons.Printer size={16}/>プレビュー
            </button>
            <button className="btn btn-ghost" onClick={exportCalendarPDF}>
              <Icons.Calendar size={16}/>カレンダー
            </button>
            <button className="btn btn-ghost" onClick={importData}>
              <Icons.Upload size={16}/>読込
            </button>
            <div className="divider-v"/>
            <button className="btn btn-outline" onClick={exportData}>
              <Icons.Save size={16}/>保存
            </button>
            <button className="btn btn-outline" onClick={confirmAndNextMonth}>
              <Icons.Check size={16}/>確定して翌月
            </button>
            <button className="btn btn-outline" onClick={() => runCandidateGeneration(5)}>
              <Icons.Dice size={16}/>候補生成
            </button>
            <button className="btn btn-primary" onClick={runAutoGenerate}>
              <Icons.Bolt size={18}/>自動生成
            </button>
          </div>
        </div>

        {/* ── タブ ── */}
        <div className="tabs">
          {TABS.map(({ key, label }) => (
            <button key={key} className="tab"
              aria-selected={tab === key}
              onClick={() => setTab(key)}>
              {label}
              {key === "alert" && totalAlerts > 0 &&
                <span className="badge-count">{totalAlerts}</span>
              }
            </button>
          ))}
        </div>

        {/* ── 勤務表タブ ── */}
        {tab === "shift" && (
          <div className="toolbar">
            <div className="month-nav">
              <button onClick={prevPeriod}><Icons.ChevronLeft size={18}/></button>
              <div className="label">{headerLabel}</div>
              <button onClick={nextPeriod}><Icons.ChevronRight size={18}/></button>
            </div>
            <div className="seg">
              <button aria-pressed={view==="month"} onClick={() => setView("month")}>月表示</button>
              <button aria-pressed={view==="week"}  onClick={() => setView("week")}>週表示</button>
            </div>
            <div className="toolbar-spacer"/>
            <div className="seg">
              <button aria-pressed={density==="compact"}     onClick={() => setDensity("compact")}>密</button>
              <button aria-pressed={density==="default"}     onClick={() => setDensity("default")}>標準</button>
              <button aria-pressed={density==="comfortable"} onClick={() => setDensity("comfortable")}>広</button>
            </div>
          </div>
        )}

        {/* ── タブコンテンツ ── */}
        <div onClick={e => e.stopPropagation()}>
          {tab === "shift"       && view === "month" && <MonthView/>}
          {tab === "shift"       && view === "week"  && <WeekView/>}
          {tab === "personal"                        && <PersonalTab/>}
          {tab === "wish"                            && <WishTab/>}
          {tab === "alert"                           && <AlertTab/>}
          {tab === "constraints"                     && <ConstraintsTab/>}
          {tab === "required"                        && <RequiredTab/>}
          {tab === "employee"                        && <EmployeeTab/>}
        </div>
      </div>

      {/* ── EditPopover（固定位置） ── */}
      {editCell && (
        <EditPopover
          empId={editCell.empId}
          day={editCell.day}
          x={editCell.x}
          y={editCell.y}
          onClose={() => setEditCell(null)}
        />
      )}

      {/* ── 候補モーダル ── */}
      {showCandidates && (
        <CandidatesModal
          candidates={candidates}
          onAdopt={adoptCandidate}
          onClose={() => setShowCandidates(false)}
          onRegenerate={n => runCandidateGeneration(n)}
        />
      )}

      {/* ── トースト通知 ── */}
      <div className={`toast${msgVisible ? "" : " hidden"}`}>{msg}</div>

    </ShiftContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  window.addEventListener('load', function() {
    try {
      const src = document.getElementById('app-src').textContent;
      const out = Babel.transform(src, { presets: ['react'] }).code;
      eval(out);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('root').style.display = 'block';
    } catch(e) {
      document.getElementById('loading').innerHTML =
        '<div style="color:#ef4444;padding:20px;font-size:13px">エラー: ' + e.message + '</div>';
      console.error(e);
    }
  });
</script>
</body>
</html>
